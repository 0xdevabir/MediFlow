name: Container scan (Trivy)

on:
  push:
    branches: [main]
    paths:
      - "backend/Dockerfile"
      - "ai-service/Dockerfile"
      - "infra/**"
      - ".github/workflows/container-scan.yml"
  pull_request:
    paths:
      - "backend/Dockerfile"
      - "ai-service/Dockerfile"
      - ".github/workflows/container-scan.yml"
  schedule:
    - cron: "30 4 * * 1"
  workflow_dispatch:

jobs:
  trivy-backend:
    name: Trivy — backend image
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - name: Build backend image
        run: docker build -t mediflow-backend:ci ./backend

      - uses: aquasecurity/trivy-action@0.30.0
        with:
          image-ref: mediflow-backend:ci
          format: table
          exit-code: "1"
          severity: CRITICAL,HIGH
          ignore-unfixed: true

  trivy-ai:
    name: Trivy — ai-service image
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - name: Skip if package not yet scaffolded
        id: gate
        run: |
          if [[ -f ai-service/pyproject.toml ]]; then
            echo "ready=true" >> "$GITHUB_OUTPUT"
          else
            echo "ready=false" >> "$GITHUB_OUTPUT"
            echo "ai-service package not present yet (T09) — skipping image build."
          fi

      - name: Build ai-service image
        if: steps.gate.outputs.ready == 'true'
        run: docker build -t mediflow-ai:ci ./ai-service

      - uses: aquasecurity/trivy-action@0.30.0
        if: steps.gate.outputs.ready == 'true'
        with:
          image-ref: mediflow-ai:ci
          format: table
          exit-code: "1"
          severity: CRITICAL,HIGH
          ignore-unfixed: true
