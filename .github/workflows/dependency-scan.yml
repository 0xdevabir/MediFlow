name: Dependency scan

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "0 4 * * 1" # Mondays 04:00 UTC
  workflow_dispatch:

concurrency:
  group: dep-scan-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend-owasp:
    name: OWASP dependency-check (backend)
    runs-on: ubuntu-latest
    timeout-minutes: 60
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
          cache-dependency-path: backend/pom.xml

      - name: OWASP Dependency-Check
        run: |
          ./mvnw -B -DskipTests org.owasp:dependency-check-maven:12.1.0:check \
            -DfailBuildOnCVSS=8 \
            -Dformat=HTML \
            -Dformat=JSON \
            || true
        # `|| true` keeps the job informational until the plugin is declared in pom
        # (T00 owns pom.xml — request recorded in docs/plan/requests/T13.md).
        # Switch to hard-fail once the plugin is wired.

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: owasp-backend
          path: backend/target/dependency-check-report.*
          if-no-files-found: ignore

  ai-pip-audit:
    name: pip-audit (ai-service)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: ai-service
    steps:
      - uses: actions/checkout@v4

      - name: Skip if package not yet scaffolded
        id: gate
        run: |
          if [[ -f pyproject.toml || -f requirements.txt ]]; then
            echo "ready=true" >> "$GITHUB_OUTPUT"
          else
            echo "ready=false" >> "$GITHUB_OUTPUT"
          fi

      - uses: astral-sh/setup-uv@v5
        if: steps.gate.outputs.ready == 'true'

      - name: pip-audit
        if: steps.gate.outputs.ready == 'true'
        run: |
          if [[ -f pyproject.toml ]]; then
            uv sync || uv pip install -e .
          else
            uv pip install -r requirements.txt
          fi
          uv pip install pip-audit
          uv run pip-audit
