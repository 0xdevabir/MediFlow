name: ZAP baseline (nightly)

on:
  schedule:
    - cron: "0 2 * * *" # nightly 02:00 UTC
  workflow_dispatch:

concurrency:
  group: zap-baseline
  cancel-in-progress: false

jobs:
  zap:
    name: OWASP ZAP baseline vs compose stack
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      - name: Generate certs + secrets
        run: |
          ./infra/certs/gen-dev-certs.sh
          ./infra/scripts/gen-secrets.sh

      - name: Start edge stack (deps + nginx + backend if buildable)
        run: |
          # Prefer prod compose; fall back to bringing nginx+deps only if backend/ai images cannot build yet.
          set +e
          docker compose -f infra/docker-compose.prod.yml build backend
          BUILD_RC=$?
          set -e
          if [[ $BUILD_RC -eq 0 ]]; then
            docker compose -f infra/docker-compose.prod.yml up -d postgres redis rabbitmq minio backend nginx
          else
            echo "Backend image build failed — running ZAP against nginx health only is not useful."
            echo "Starting data plane for smoke; ZAP target will be skipped if HTTPS is not up."
            docker compose -f infra/docker-compose.yml up -d
          fi

      - name: Wait for HTTPS edge
        id: edge
        run: |
          for i in $(seq 1 60); do
            if curl -skf https://localhost/nginx-health >/dev/null 2>&1 \
              || curl -skf https://127.0.0.1/nginx-health >/dev/null 2>&1; then
              echo "up=true" >> "$GITHUB_OUTPUT"
              exit 0
            fi
            sleep 5
          done
          echo "up=false" >> "$GITHUB_OUTPUT"
          echo "Edge HTTPS never became ready — ZAP will be skipped."

      - name: ZAP baseline scan
        if: steps.edge.outputs.up == 'true'
        uses: zaproxy/action-baseline@v0.14.0
        with:
          target: "https://127.0.0.1"
          docker_name: "ghcr.io/zaproxy/zaproxy:stable"
          cmd_options: "-a -I" # fail on HIGH; ignore warnings for baseline noise
          allow_issue_writing: false

      - name: Upload ZAP report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: zap-baseline
          path: report_html.html
          if-no-files-found: ignore

      - name: Tear down
        if: always()
        run: |
          docker compose -f infra/docker-compose.prod.yml down -v || true
          docker compose -f infra/docker-compose.yml down -v || true
