notification.tpl.APPOINTMENT_REMINDER_24H.body=Reminder: Dear {0}, you have an appointment on {1}.
notification.tpl.APPOINTMENT_REMINDER_2H.subject=Appointment in 2 hours
notification.tpl.APPOINTMENT_REMINDER_2H.body=Reminder: Dear {0}, your appointment is at {1}. Please arrive on time.
notification.tpl.QUEUE_NEXT.subject=You''re next
notification.tpl.QUEUE_NEXT.body=Dear {0}, you''re next in the queue (token {1}). Please be ready.
notification.tpl.TRIAGE_PRIORITY.subject=Priority patient
notification.tpl.TRIAGE_PRIORITY.body=Priority alert: {0} has been triaged {1}.
notification.tpl.RED_ALERT.subject=RED ALERT
notification.tpl.RED_ALERT.body=RED ALERT ({1}): {0} needs immediate attention. Raised {2}.
notification.tpl.LAB_ORDER_CREATED.subject=Lab test booked
notification.tpl.LAB_ORDER_CREATED.body=Dear {0}, your lab test has been booked. We will notify you when the report is ready.
notification.tpl.REPORT_READY.subject=Lab report ready
notification.tpl.REPORT_READY.body=Dear {0}, your lab report is ready. You can view it in MediFlow.
notification.tpl.REPORT_READY_DOCTOR.subject=Lab report ready
notification.tpl.REPORT_READY_DOCTOR.body=The lab report of {0} has been verified and is ready to review.
notification.tpl.SEE_DOCTOR.subject=Please see a doctor
notification.tpl.SEE_DOCTOR.body=Dear {0}, your lab report is ready and shows results outside the normal range. Please see a doctor.
notification.tpl.LAB_CRITICAL_PATIENT.subject=Urgent: contact your doctor
notification.tpl.LAB_CRITICAL_PATIENT.body=Dear {0}, your lab report shows a critical result. Please contact a doctor or the hospital immediately.
notification.tpl.LAB_CRITICAL_DOCTOR.subject=Critical lab result
notification.tpl.LAB_CRITICAL_DOCTOR.body=CRITICAL lab result for {0}. Please review now; the patient is being contacted.
notification.tpl.RX_SIGNED.subject=Prescription ready
notification.tpl.RX_SIGNED.body=Dear {0}, your prescription has been signed. Medicine reminders have been set up.
notification.tpl.RX_REVOKED.subject=Prescription withdrawn
notification.tpl.RX_REVOKED.body=Dear {0}, your prescription was withdrawn by the doctor. Do not use it; its reminders have been stopped.
notification.tpl.RX_AMENDED.subject=Prescription updated
notification.tpl.RX_AMENDED.body=Dear {0}, your prescription has been updated. Your medicine reminders now follow the new version.
notification.tpl.MEDICATION_DISPENSED.subject=Medicine dispensed
notification.tpl.MEDICATION_DISPENSED.body=Dear {0}, your medicine has been dispensed by the pharmacy.
notification.tpl.MEDICATION_REMINDER.subject=Medicine reminder
notification.tpl.MEDICATION_REMINDER.body=Dear {0}, time to take {1} {2} ({3}). Please mark it as taken in MediFlow.
notification.tpl.FOLLOW_UP_REMINDER.subject=Follow-up visit
notification.tpl.FOLLOW_UP_REMINDER.body=Dear {0}, your follow-up visit is due on {1}.
notification.tpl.SCHEDULE_CHANGED.subject=Schedule changed
notification.tpl.SCHEDULE_CHANGED.body=Dear {0}, your appointment time has changed to {1}.

