# notification module messages (en) — owned by T10
# Templates: notification.tpl.<EVENT>.subject|body ({n} = MessageFormat args; '' = apostrophe)
notification.tpl.WELCOME.subject=Welcome to MediFlow
notification.tpl.WELCOME.body=Dear {0}, your MediFlow account is ready. You will receive appointment, report and medicine reminders here.
notification.tpl.APPOINTMENT_BOOKED.subject=Appointment confirmed
notification.tpl.APPOINTMENT_BOOKED.body=Dear {0}, your appointment is confirmed for {1}. We will remind you 24 hours and 2 hours before.
notification.tpl.APPOINTMENT_BOOKED_DOCTOR.subject=New appointment booked
notification.tpl.APPOINTMENT_BOOKED_DOCTOR.body=New appointment: {0} on {1}.
notification.tpl.APPOINTMENT_CANCELLED.subject=Appointment cancelled
notification.tpl.APPOINTMENT_CANCELLED.body=Dear {0}, your appointment has been cancelled. You can book a new slot in MediFlow.
notification.tpl.APPOINTMENT_CANCELLED_DOCTOR.subject=Appointment cancelled
notification.tpl.APPOINTMENT_CANCELLED_DOCTOR.body=The appointment of {0} has been cancelled.
notification.tpl.APPOINTMENT_CHECKED_IN.subject=Checked in
notification.tpl.APPOINTMENT_CHECKED_IN.body=Dear {0}, you are checked in. Your queue token is {1}.
