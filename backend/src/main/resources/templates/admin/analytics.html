<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{layout/base :: head('admin.analytics.title')}"></head>
<body class="bg-light">
<div th:replace="~{layout/base :: nav}"></div>
<main class="container mb-5">
  <div th:replace="~{layout/base :: flash}"></div>
  <h1 class="h3 mb-2" th:text="#{admin.analytics.title}">Analytics</h1>
  <p class="text-muted" th:text="#{admin.analytics.intro}">Intro</p>
  <dl class="row">
    <th:block th:each="entry : ${kpis}">
      <dt class="col-sm-7" th:text="#{__${'admin.analytics.' + entry.key}__}">KPI</dt>
      <dd class="col-sm-5">
        <span th:if="${entry.value.value() == null}" th:text="#{admin.analytics.empty}">n/a</span>
        <span th:unless="${entry.value.value() == null}">
          <span th:text="${entry.value.value()}">0</span>
          <span class="text-muted small" th:text="${entry.value.unit()}">unit</span>
        </span>
      </dd>
    </th:block>
  </dl>
  <p class="mt-3"><a th:href="@{/admin}" th:text="#{admin.dashboard.title}">Admin</a></p>
</main>
<th:block th:replace="~{layout/base :: scripts}"></th:block>
</body>
</html>
