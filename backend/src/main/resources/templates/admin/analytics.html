<!DOCTYPE html>
<html th:lang="${#locale.language}" lang="en" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{layout/base :: head('admin.analytics.title')}"></head>
<body class="mf-app">
<a th:replace="~{layout/base :: skipLink}"></a>
<div th:replace="~{layout/base :: nav}"></div>
<main id="main" class="container mf-panel-wide mb-5">
  <div th:replace="~{layout/base :: flash}"></div>
  <div th:replace="~{layout/fragments/page-shell :: page-header(titleKey='admin.analytics.title', subtitleKey='admin.analytics.intro')}"></div>

  <div th:if="${kpis == null or kpis.isEmpty()}"
       th:replace="~{layout/fragments/empty-state :: empty('admin.analytics.empty', '')}"></div>

  <div class="mf-role-grid mf-role-grid-3" th:unless="${kpis == null or kpis.isEmpty()}">
    <section class="mf-tile" th:each="entry : ${kpis}">
      <h2 class="mf-tile-title" th:text="#{__${'admin.analytics.' + entry.key}__}">KPI</h2>
      <p class="mf-tile-meta mb-0">
        <span th:if="${entry.value.value() == null}" th:text="#{admin.analytics.empty}">n/a</span>
        <span th:unless="${entry.value.value() == null}">
          <span class="fs-4 fw-semibold" th:text="${entry.value.value()}">0</span>
          <span class="text-muted small" th:text="${entry.value.unit()}">unit</span>
        </span>
      </p>
    </section>
  </div>

  <p class="mt-4"><a th:href="@{/admin}" th:text="#{admin.dashboard.back}">Back to admin</a></p>
</main>
<th:block th:replace="~{layout/base :: scripts}"></th:block>
</body>
</html>
