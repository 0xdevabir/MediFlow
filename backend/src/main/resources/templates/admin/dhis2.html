<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{layout/base :: head('admin.dhis2.title')}"></head>
<body class="bg-light">
<div th:replace="~{layout/base :: nav}"></div>
<main class="container mb-5">
  <div th:replace="~{layout/base :: flash}"></div>
  <h1 class="h3 mb-2" th:text="#{admin.dhis2.title}">DHIS2</h1>
  <p class="text-muted" th:text="#{admin.dhis2.intro}">Intro</p>
  <p class="badge text-bg-secondary" th:text="#{admin.dhis2.pushOff}">push off</p>
  <form class="row g-2 align-items-end mt-3" method="get" th:action="@{/admin/dhis2/export}">
    <div class="col-auto">
      <label class="form-label" th:text="#{admin.dhis2.month}">Month</label>
      <input class="form-control" type="date" name="month"/>
    </div>
    <div class="col-auto">
      <button class="btn btn-primary" type="submit" th:text="#{admin.dhis2.download}">Download</button>
    </div>
  </form>
  <p class="mt-3"><a th:href="@{/admin}" th:text="#{admin.dashboard.title}">Admin</a></p>
</main>
<th:block th:replace="~{layout/base :: scripts}"></th:block>
</body>
</html>
