<!DOCTYPE html>
<html th:lang="${#locale.language}" lang="en" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{layout/base :: head('admin.dhis2.title')}"></head>
<body class="mf-app">
<a th:replace="~{layout/base :: skipLink}"></a>
<div th:replace="~{layout/base :: nav}"></div>
<main id="main" class="container mf-panel-narrow mb-5">
  <div th:replace="~{layout/base :: flash}"></div>
  <div th:replace="~{layout/fragments/page-shell :: page-header(titleKey='admin.dhis2.title', subtitleKey='admin.dhis2.intro')}"></div>

  <div class="mf-panel mb-4">
    <p class="mb-2">
      <span class="mf-badge mf-badge-normal" th:text="#{admin.dhis2.pushOff}">Live push: disabled</span>
    </p>
    <p class="small text-muted mb-0" th:text="#{admin.dhis2.orgUnitNote}">
      Org-unit is a placeholder string until facility mapping exists. Exported JSON uses orgUnit=MediFlow.
    </p>
  </div>

  <form class="mf-panel row g-3 align-items-end" method="get" th:action="@{/admin/dhis2/export}">
    <div class="col-sm-6">
      <label class="form-label" for="dhis2-month" th:text="#{admin.dhis2.month}">Month</label>
      <input class="form-control" id="dhis2-month" type="date" name="month"/>
    </div>
    <div class="col-sm-6">
      <button class="btn btn-teal" type="submit" th:text="#{admin.dhis2.download}">Download JSON</button>
    </div>
  </form>

  <p class="mt-4"><a th:href="@{/admin}" th:text="#{admin.dashboard.back}">Back to admin</a></p>
</main>
<th:block th:replace="~{layout/base :: scripts}"></th:block>
</body>
</html>
