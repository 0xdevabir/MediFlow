<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{layout/base :: head('admin.settings.title')}"></head>
<body class="bg-light">
<div th:replace="~{layout/base :: nav}"></div>
<main class="container mb-5">
  <div th:replace="~{layout/base :: flash}"></div>
  <h1 class="h3 mb-3" th:text="#{admin.settings.title}">Settings</h1>

  <h2 class="h5" th:text="#{admin.settings.current}">Current</h2>
  <div class="table-responsive mb-4">
    <table class="table table-sm">
      <thead>
      <tr>
        <th th:text="#{admin.settings.key}">Key</th>
        <th th:text="#{admin.settings.value}">Value</th>
        <th th:text="#{admin.settings.version}">Version</th>
      </tr>
      </thead>
      <tbody>
      <tr th:each="s : ${settings}">
        <td th:text="${s.key()}">k</td>
        <td th:text="${s.value()}">v</td>
        <td th:text="${s.valueVersion()}">1</td>
      </tr>
      </tbody>
    </table>
  </div>

  <div class="row g-4">
    <div class="col-md-6" th:if="${isAdmin}">
      <h2 class="h5" th:text="#{admin.settings.direct}">Direct</h2>
      <form method="post" th:action="@{/admin/settings/direct}" class="vstack gap-2">
        <input class="form-control" name="key" placeholder="audit.retention.years" required/>
        <input class="form-control" name="value" required/>
        <button class="btn btn-outline-primary" type="submit" th:text="#{admin.settings.submit}">Save</button>
      </form>
    </div>
    <div class="col-md-6">
      <h2 class="h5" th:text="#{admin.settings.request}">Request</h2>
      <p class="small text-muted" th:text="#{admin.settings.aiHint}">AI hint</p>
      <form method="post" th:action="@{/admin/settings/request}" class="vstack gap-2">
        <input class="form-control" name="key" th:value="${aiKey}" required/>
        <input class="form-control" name="value" placeholder="0.90" required/>
        <button class="btn btn-primary" type="submit" th:text="#{admin.settings.requestSubmit}">Request</button>
      </form>
    </div>
  </div>

  <h2 class="h5 mt-4" th:text="#{admin.settings.pending}">Pending</h2>
  <p th:if="${pending.isEmpty()}" class="text-muted" th:text="#{admin.settings.emptyPending}">None</p>
  <div class="list-group" th:unless="${pending.isEmpty()}">
    <div class="list-group-item" th:each="p : ${pending}">
      <div class="fw-semibold">
        <span th:text="${p.settingKey}">key</span> →
        <span th:text="${p.proposedValue}">val</span>
      </div>
      <div class="small text-muted" th:text="${p.requestedAt}">at</div>
      <div class="mt-2 d-flex gap-2">
        <form th:action="@{/admin/settings/{id}/approve(id=${p.id})}" method="post">
          <button class="btn btn-sm btn-success" type="submit" th:text="#{admin.settings.approve}">Approve</button>
        </form>
        <form th:action="@{/admin/settings/{id}/reject(id=${p.id})}" method="post" class="d-flex gap-1">
          <input class="form-control form-control-sm" name="reason" placeholder="reason"/>
          <button class="btn btn-sm btn-outline-danger" type="submit" th:text="#{admin.settings.reject}">Reject</button>
        </form>
      </div>
    </div>
  </div>
  <p class="mt-3"><a th:href="@{/admin}" th:text="#{admin.dashboard.title}">Admin</a></p>
</main>
<th:block th:replace="~{layout/base :: scripts}"></th:block>
</body>
</html>
