<!DOCTYPE html>
<html th:lang="${#locale.language}" lang="en" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{layout/base :: head('admin.settings.title')}"></head>
<body class="mf-app">
<a th:replace="~{layout/base :: skipLink}"></a>
<div th:replace="~{layout/base :: nav}"></div>
<main id="main" class="container mf-panel-wide mb-5">
  <div th:replace="~{layout/base :: flash}"></div>
  <div th:replace="~{layout/fragments/page-shell :: page-header(titleKey='admin.settings.title', subtitleKey='admin.settings.intro')}"></div>

  <section class="mb-5" aria-labelledby="pending-heading">
    <h2 id="pending-heading" class="h5 mb-3" th:text="#{admin.settings.pending}">Pending dual approvals</h2>
    <div th:if="${pending == null or pending.isEmpty()}"
         th:replace="~{layout/fragments/empty-state :: empty('admin.settings.emptyPending', 'admin.approver.emptyHint')}"></div>
    <div class="vstack gap-3" th:unless="${pending == null or pending.isEmpty()}">
      <article class="mf-panel" th:each="p : ${pending}">
        <div class="d-flex flex-wrap justify-content-between gap-2 mb-2">
          <div>
            <div class="fw-semibold">
              <span th:text="${p.settingKey}">key</span>
              <span class="text-muted">→</span>
              <span th:text="${p.proposedValue}">val</span>
            </div>
            <div class="small text-muted" th:text="${p.requestedAt}">at</div>
          </div>
          <span class="mf-badge mf-badge-ai" th:text="#{admin.approver.pendingBadge}">Pending</span>
        </div>
        <div class="d-flex flex-wrap gap-2 align-items-center">
          <form th:action="@{/admin/settings/{id}/approve(id=${p.id})}" method="post">
            <button class="btn btn-sm btn-teal" type="submit" th:text="#{admin.settings.approve}">Approve</button>
          </form>
          <form th:action="@{/admin/settings/{id}/reject(id=${p.id})}" method="post" class="d-flex flex-wrap gap-2">
            <label class="visually-hidden" th:for="${'settings-reject-' + p.id}" th:text="#{admin.settings.rejectReason}">Reason</label>
            <input class="form-control form-control-sm" th:id="${'settings-reject-' + p.id}"
                   name="reason" th:placeholder="#{admin.settings.rejectReason}"/>
            <button class="btn btn-sm btn-outline-danger" type="submit" th:text="#{admin.settings.reject}">Reject</button>
          </form>
        </div>
      </article>
    </div>
  </section>

  <section class="mb-5" aria-labelledby="current-settings">
    <h2 id="current-settings" class="h5 mb-3" th:text="#{admin.settings.current}">Current values</h2>
    <div th:if="${settings == null or settings.isEmpty()}"
         th:replace="~{layout/fragments/empty-state :: empty('admin.settings.emptyCurrent', '')}"></div>
    <div class="table-responsive mf-panel p-0" th:unless="${settings == null or settings.isEmpty()}">
      <table class="table mf-data-table mf-table-stack align-middle mb-0">
        <thead>
        <tr>
          <th th:text="#{admin.settings.key}">Key</th>
          <th th:text="#{admin.settings.value}">Value</th>
          <th th:text="#{admin.settings.version}">Version</th>
        </tr>
        </thead>
        <tbody>
        <tr th:each="s : ${settings}">
          <td th:attr="data-label=#{admin.settings.key}" th:text="${s.key()}">k</td>
          <td th:attr="data-label=#{admin.settings.value}" th:text="${s.value()}">v</td>
          <td th:attr="data-label=#{admin.settings.version}" th:text="${s.valueVersion()}">1</td>
        </tr>
        </tbody>
      </table>
    </div>
  </section>

  <div class="row g-4">
    <div class="col-md-6" th:if="${isAdmin}">
      <section class="mf-panel h-100" aria-labelledby="direct-heading">
        <h2 id="direct-heading" class="h5 mb-2" th:text="#{admin.settings.direct}">Direct</h2>
        <p class="small text-muted" th:text="#{admin.settings.directHint}">Non-governed keys only</p>
        <form method="post" th:action="@{/admin/settings/direct}" class="vstack gap-2">
          <div>
            <label class="form-label" for="direct-key" th:text="#{admin.settings.key}">Key</label>
            <input class="form-control" id="direct-key" name="key" placeholder="audit.retention.years" required/>
          </div>
          <div>
            <label class="form-label" for="direct-value" th:text="#{admin.settings.value}">Value</label>
            <input class="form-control" id="direct-value" name="value" required/>
          </div>
          <button class="btn btn-outline-secondary" type="submit" th:text="#{admin.settings.submit}">Save</button>
        </form>
      </section>
    </div>
    <div class="col-md-6">
      <section class="mf-panel h-100" aria-labelledby="request-heading">
        <h2 id="request-heading" class="h5 mb-2" th:text="#{admin.settings.request}">Request</h2>
        <p class="small text-muted" th:text="#{admin.settings.aiHint}">AI hint</p>
        <p class="small" th:text="#{admin.settings.requiresApproval}">Dual approval</p>
        <form method="post" th:action="@{/admin/settings/request}" class="vstack gap-2">
          <div>
            <label class="form-label" for="request-key" th:text="#{admin.settings.key}">Key</label>
            <input class="form-control" id="request-key" name="key" th:value="${aiKey}" required/>
          </div>
          <div>
            <label class="form-label" for="request-value" th:text="#{admin.settings.value}">Value</label>
            <input class="form-control" id="request-value" name="value" placeholder="0.90" required/>
          </div>
          <button class="btn btn-teal" type="submit" th:text="#{admin.settings.requestSubmit}">Request</button>
        </form>
      </section>
    </div>
  </div>

  <p class="mt-4"><a th:href="@{/admin}" th:text="#{admin.dashboard.back}">Back to admin</a></p>
</main>
<th:block th:replace="~{layout/base :: scripts}"></th:block>
</body>
</html>
