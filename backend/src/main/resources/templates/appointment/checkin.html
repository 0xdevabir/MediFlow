<!DOCTYPE html>
<html th:lang="${#locale.language}" lang="en" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{layout/base :: head('appointment.checkin.title')}"></head>
<body class="mf-app">
<a th:replace="~{layout/base :: skipLink}"></a>
<div th:replace="~{layout/base :: nav}"></div>
<main id="main" class="container mf-panel-narrow mb-5">
  <div th:replace="~{layout/base :: flash}"></div>
  <div th:replace="~{layout/fragments/page-shell :: page-header(titleKey='appointment.checkin.title', subtitleKey='appointment.checkin.subtitle')}"></div>

  <section class="mb-4 mf-panel p-3">
    <h2 class="h5" th:text="#{appointment.checkin.byCode}">By code</h2>
    <p class="text-muted small" th:text="#{appointment.checkin.emergencyHint}">Flag emergencies after check-in via appointment detail or triage.</p>
    <form class="row g-2" method="post" th:action="@{/appointments/check-in/code}">
      <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">
      <div class="col-md-8">
        <label class="form-label" for="checkin-code" th:text="#{appointment.checkin.code}">Code</label>
        <input class="form-control" id="checkin-code" name="code" required
               th:placeholder="#{appointment.checkin.code}" autocomplete="off">
      </div>
      <div class="col-md-4 d-flex align-items-end">
        <button class="btn btn-teal w-100" type="submit" th:text="#{appointment.checkin.submit}">Check in</button>
      </div>
    </form>
  </section>

  <section class="mb-4 mf-panel p-3">
    <h2 class="h5" th:text="#{appointment.checkin.byIds}">By identifiers</h2>
    <form class="row g-2" method="post" th:action="@{/appointments/check-in/identifiers}">
      <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">
      <div class="col-md-4">
        <label class="form-label" for="checkin-appt" th:text="#{appointment.checkin.appointmentId}">Appointment</label>
        <input class="form-control" id="checkin-appt" name="appointmentId" required
               th:placeholder="#{appointment.checkin.appointmentId}">
      </div>
      <div class="col-md-3">
        <label class="form-label" for="checkin-id-a" th:text="#{appointment.checkin.idA}">ID 1</label>
        <input class="form-control" id="checkin-id-a" name="identifierA" required
               th:placeholder="#{appointment.checkin.idA}">
      </div>
      <div class="col-md-3">
        <label class="form-label" for="checkin-id-b" th:text="#{appointment.checkin.idB}">ID 2</label>
        <input class="form-control" id="checkin-id-b" name="identifierB" required
               th:placeholder="#{appointment.checkin.idB}">
      </div>
      <div class="col-md-2 d-flex align-items-end">
        <button class="btn btn-teal w-100" type="submit" th:text="#{appointment.checkin.submit}">Check in</button>
      </div>
    </form>
  </section>

  <section class="mf-panel p-3">
    <h2 class="h5" th:text="#{appointment.checkin.lookup}">Lookup</h2>
    <form class="row g-2 mb-3" method="get" th:action="@{/appointments/patient-lookup}">
      <div class="col-md-6">
        <label class="form-label" for="checkin-mrn" th:text="#{appointment.checkin.mrn}">MRN</label>
        <input class="form-control" id="checkin-mrn" name="mrn" th:value="${mrn}"
               th:placeholder="#{appointment.checkin.mrn}" required>
      </div>
      <div class="col-md-3 d-flex align-items-end">
        <button class="btn btn-outline-secondary w-100" type="submit" th:text="#{appointment.checkin.lookupGo}">Go</button>
      </div>
    </form>
    <div th:if="${patient != null}" class="mb-2 fw-semibold"
         th:text="${patient.givenName + ' ' + patient.familyName + ' · ' + patient.mrn}">Patient</div>
    <ul class="list-unstyled" th:if="${appointments != null}">
      <li th:each="a : ${appointments}" class="mb-1">
        <a th:href="@{/appointments/{id}(id=${a.id})}">
          <span th:replace="~{layout/fragments/status-badge :: badge(${a.priorityLevel != null ? a.priorityLevel : 'NORMAL'}, ${a.status})}"></span>
          <span class="ms-1" th:text="${a.bookedAt}">time</span>
        </a>
      </li>
    </ul>
  </section>
</main>
<th:block th:replace="~{layout/base :: scripts}"></th:block>
</body>
</html>
