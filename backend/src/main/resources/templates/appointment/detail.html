<!DOCTYPE html>
<html th:lang="${#locale.language}" lang="en" xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head th:replace="~{layout/base :: head('appointment.detail.title')}"></head>
<body class="mf-app">
<a th:replace="~{layout/base :: skipLink}"></a>
<div th:replace="~{layout/base :: nav}"></div>
<main id="main" class="container mf-panel-narrow mb-5">
  <div th:replace="~{layout/base :: flash}"></div>
  <div th:replace="~{layout/fragments/page-shell :: page-header(titleKey='appointment.detail.title', subtitleKey=null)}"></div>

  <dl class="row">
    <dt class="col-sm-3" th:text="#{appointment.detail.status}">Status</dt>
    <dd class="col-sm-9">
      <span th:replace="~{layout/fragments/status-badge :: badge(${appointment.priorityLevel != null ? appointment.priorityLevel : 'NORMAL'}, ${appointment.status})}"></span>
    </dd>
    <dt class="col-sm-3" th:text="#{appointment.detail.priority}">Priority</dt>
    <dd class="col-sm-9" th:text="${appointment.priorityLevel}">NORMAL</dd>
    <dt class="col-sm-3" th:text="#{appointment.detail.booked}">Booked</dt>
    <dd class="col-sm-9" th:text="${appointment.bookedAt}">t</dd>
    <dt class="col-sm-3" th:if="${meta != null}" th:text="#{appointment.detail.checkinCode}">Code</dt>
    <dd class="col-sm-9" th:if="${meta != null}" th:text="${meta.checkinCode}">CODE</dd>
    <dt class="col-sm-3" th:if="${patient != null}" th:text="#{appointment.detail.patient}">Patient</dt>
    <dd class="col-sm-9" th:if="${patient != null}"
        th:text="${patient.givenName + ' ' + patient.familyName + ' (' + patient.mrn + ')'}">Name</dd>
    <dt class="col-sm-3" th:if="${slot != null}" th:text="#{appointment.detail.slot}">Slot</dt>
    <dd class="col-sm-9" th:if="${slot != null}"
        th:text="${slot.doctorName() + ' · ' + slot.startsAt()}">slot</dd>
  </dl>

  <div class="d-flex gap-2 flex-wrap">
    <form method="post" th:action="@{/appointments/{id}/cancel(id=${appointment.id})}"
          th:if="${appointment.status.name() == 'BOOKED'}">
      <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">
      <button class="btn btn-outline-danger" type="submit" th:text="#{appointment.detail.cancel}">Cancel</button>
    </form>
    <a class="btn btn-outline-primary"
       th:if="${appointment.status.name() == 'BOOKED'}"
       th:href="@{/appointments/{id}/reschedule(id=${appointment.id})}"
       th:text="#{appointment.detail.reschedule}">Reschedule</a>
    <form method="post" th:action="@{/appointments/{id}/flag-emergency(id=${appointment.id})}"
          sec:authorize="hasAnyRole('FRONT_DESK','NURSE')">
      <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">
      <input type="hidden" name="note" value="Suspected emergency at desk">
      <button class="btn btn-warning" type="submit" th:text="#{appointment.detail.flagEmergency}">Flag</button>
    </form>
    <a class="btn btn-link" th:href="@{/queue/me}" sec:authorize="hasRole('PATIENT')"
       th:text="#{appointment.detail.queueStatus}">Queue status</a>
  </div>
</main>
<th:block th:replace="~{layout/base :: scripts}"></th:block>
</body>
</html>
