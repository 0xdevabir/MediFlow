<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head th:replace="~{layout/base :: head('appointment.list.title')}"></head>
<body class="bg-light">
<div th:replace="~{layout/base :: nav}"></div>
<main class="container mb-5">
  <div th:replace="~{layout/base :: flash}"></div>
  <div class="d-flex justify-content-between align-items-center mb-3">
    <h1 class="h3 mb-0" th:text="#{appointment.list.title}">My appointments</h1>
    <a class="btn btn-primary" th:href="@{/appointments/book}" th:text="#{appointment.list.book}">Book</a>
  </div>
  <div th:if="${appointments == null or appointments.isEmpty()}" class="text-muted" th:text="#{appointment.list.empty}">Empty</div>
  <div class="list-group" th:if="${appointments != null}">
    <a class="list-group-item list-group-item-action"
       th:each="a : ${appointments}"
       th:href="@{/appointments/{id}(id=${a.id})}">
      <div class="d-flex justify-content-between">
        <span th:text="${a.status}">STATUS</span>
        <span class="text-muted" th:text="${a.bookedAt}">time</span>
      </div>
      <small class="text-muted" th:text="${a.priorityLevel}">NORMAL</small>
    </a>
  </div>
</main>
<th:block th:replace="~{layout/base :: scripts}"></th:block>
</body>
</html>
