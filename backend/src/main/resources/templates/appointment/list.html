<!DOCTYPE html>
<html th:lang="${#locale.language}" lang="en" xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head th:replace="~{layout/base :: head('appointment.list.title')}"></head>
<body class="mf-app">
<a th:replace="~{layout/base :: skipLink}"></a>
<div th:replace="~{layout/base :: nav}"></div>
<main id="main" class="container mf-panel-wide mb-5">
  <div th:replace="~{layout/base :: flash}"></div>
  <div class="d-flex flex-wrap justify-content-between align-items-start gap-3 mb-4">
    <div>
      <h1 class="mf-page-title" th:text="#{appointment.list.title}">My appointments</h1>
      <p class="mf-page-subtitle mb-0" th:text="#{appointment.list.subtitle}">Upcoming and recent visits.</p>
    </div>
    <a class="btn btn-teal" th:href="@{/appointments/book}" th:text="#{appointment.list.book}">Book</a>
  </div>

  <div th:if="${appointments == null or appointments.isEmpty()}"
       th:replace="~{layout/fragments/empty-state :: empty('appointment.list.empty', 'appointment.list.emptyHint')}"></div>

  <div class="list-group mf-worklist" th:if="${appointments != null and !appointments.isEmpty()}">
    <a class="list-group-item list-group-item-action"
       th:each="a : ${appointments}"
       th:href="@{/appointments/{id}(id=${a.id})}">
      <div class="d-flex flex-wrap justify-content-between gap-2">
        <span th:replace="~{layout/fragments/status-badge :: badge(${a.priorityLevel != null ? a.priorityLevel : 'NORMAL'}, ${a.status})}"></span>
        <span class="text-muted" th:text="${a.bookedAt}">time</span>
      </div>
      <small class="text-muted" th:if="${a.priorityLevel != null}" th:text="${a.priorityLevel}">NORMAL</small>
    </a>
  </div>
</main>
<th:block th:replace="~{layout/base :: scripts}"></th:block>
</body>
</html>
