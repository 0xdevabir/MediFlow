<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{layout/base :: head('audit.me.title')}"></head>
<body class="bg-light">
<div th:replace="~{layout/base :: nav}"></div>
<main class="container mb-5">
  <div th:replace="~{layout/base :: flash}"></div>
  <h1 class="h3 mb-3" th:text="#{audit.me.title}">Who accessed my record</h1>
  <p th:if="${rows.isEmpty()}" class="text-muted" th:text="#{audit.me.empty}">No access events yet.</p>
  <div class="table-responsive" th:unless="${rows.isEmpty()}">
    <table class="table table-sm table-striped align-middle">
      <thead>
      <tr>
        <th th:text="#{audit.me.when}">When</th>
        <th th:text="#{audit.me.who}">Who</th>
        <th th:text="#{audit.me.roles}">Role</th>
        <th th:text="#{audit.me.action}">Action</th>
        <th th:text="#{audit.me.purpose}">Purpose</th>
      </tr>
      </thead>
      <tbody>
      <tr th:each="r : ${rows}">
        <td th:text="${r.occurredAt}">2026-11-07</td>
        <td th:text="${r.actorName}">Name</td>
        <td th:text="${r.actorRoles}">ROLE_DOCTOR</td>
        <td th:text="${r.action}">PATIENT_READ</td>
        <td th:text="${r.purpose}">treatment</td>
      </tr>
      </tbody>
    </table>
  </div>
</main>
<th:block th:replace="~{layout/base :: scripts}"></th:block>
</body>
</html>
