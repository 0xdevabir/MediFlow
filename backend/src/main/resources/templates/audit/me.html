<!DOCTYPE html>
<html th:lang="${#locale.language}" lang="en" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{layout/base :: head('audit.me.title')}"></head>
<body class="mf-app">
<a th:replace="~{layout/base :: skipLink}"></a>
<div th:replace="~{layout/base :: nav}"></div>
<main id="main" class="container mf-panel-wide mb-5">
  <div th:replace="~{layout/base :: flash}"></div>
  <div th:replace="~{layout/fragments/page-shell :: page-header(titleKey='audit.me.title', subtitleKey='audit.me.intro')}"></div>

  <div th:if="${rows == null or rows.isEmpty()}"
       th:replace="~{layout/fragments/empty-state :: empty('audit.me.empty', 'audit.me.emptyHint')}"></div>

  <div class="table-responsive mf-panel p-0" th:unless="${rows == null or rows.isEmpty()}">
    <table class="table mf-data-table mf-table-stack align-middle mb-0">
      <thead>
      <tr>
        <th th:text="#{audit.me.when}">When</th>
        <th th:text="#{audit.me.who}">Who</th>
        <th th:text="#{audit.me.roles}">Role</th>
        <th th:text="#{audit.me.action}">Action</th>
        <th th:text="#{audit.me.purpose}">Purpose</th>
      </tr>
      </thead>
      <tbody>
      <tr th:each="r : ${rows}">
        <td th:attr="data-label=#{audit.me.when}" th:text="${r.occurredAt}">2026-11-07</td>
        <td th:attr="data-label=#{audit.me.who}" th:text="${r.actorName}">Name</td>
        <td th:attr="data-label=#{audit.me.roles}" th:text="${r.actorRoles}">ROLE_DOCTOR</td>
        <td th:attr="data-label=#{audit.me.action}" th:text="${r.action}">PATIENT_READ</td>
        <td th:attr="data-label=#{audit.me.purpose}" th:text="${r.purpose}">treatment</td>
      </tr>
      </tbody>
    </table>
  </div>
</main>
<th:block th:replace="~{layout/base :: scripts}"></th:block>
</body>
</html>
