<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{layout/base :: head('audit.search.title')}"></head>
<body class="bg-light">
<div th:replace="~{layout/base :: nav}"></div>
<main class="container mb-5">
  <div th:replace="~{layout/base :: flash}"></div>
  <h1 class="h3 mb-3" th:text="#{audit.search.title}">Audit search</h1>
  <form class="row g-2 mb-4" method="get" th:action="@{/admin/audit/search}">
    <div class="col-md-3">
      <label class="form-label" th:text="#{audit.search.actor}">Actor</label>
      <input class="form-control" name="actorUserId" th:value="${actorUserId}"/>
    </div>
    <div class="col-md-3">
      <label class="form-label" th:text="#{audit.search.patient}">Patient</label>
      <input class="form-control" name="patientId" th:value="${patientId}"/>
    </div>
    <div class="col-md-2">
      <label class="form-label" th:text="#{audit.search.action}">Action</label>
      <input class="form-control" name="action" th:value="${action}"/>
    </div>
    <div class="col-md-2">
      <label class="form-label" th:text="#{audit.search.from}">From</label>
      <input class="form-control" type="date" name="from" th:value="${from}"/>
    </div>
    <div class="col-md-2">
      <label class="form-label" th:text="#{audit.search.to}">To</label>
      <input class="form-control" type="date" name="to" th:value="${to}"/>
    </div>
    <div class="col-12">
      <button class="btn btn-primary" type="submit" th:text="#{audit.search.submit}">Search</button>
    </div>
  </form>
  <p th:if="${rows.isEmpty()}" class="text-muted" th:text="#{audit.search.empty}">Empty</p>
  <div class="table-responsive" th:unless="${rows.isEmpty()}">
    <table class="table table-sm table-striped">
      <thead>
      <tr>
        <th th:text="#{audit.search.seq}">Seq</th>
        <th th:text="#{audit.search.when}">When</th>
        <th th:text="#{audit.search.actorName}">Actor</th>
        <th th:text="#{audit.search.patientId}">Patient</th>
        <th th:text="#{audit.search.action}">Action</th>
        <th th:text="#{audit.search.resource}">Resource</th>
        <th th:text="#{audit.search.purpose}">Purpose</th>
        <th th:text="#{audit.search.outcome}">Outcome</th>
      </tr>
      </thead>
      <tbody>
      <tr th:each="r : ${rows}">
        <td th:text="${r.seq}">1</td>
        <td th:text="${r.occurredAt}">t</td>
        <td th:text="${r.actorName}">n</td>
        <td th:text="${r.patientId}">p</td>
        <td th:text="${r.action}">a</td>
        <td>
          <span th:text="${r.resourceType}">T</span>
          <span th:if="${r.resourceId != null}" th:text="${r.resourceId}">id</span>
        </td>
        <td th:text="${r.purpose}">p</td>
        <td th:text="${r.outcome}">o</td>
      </tr>
      </tbody>
    </table>
  </div>
  <p class="mt-3"><a th:href="@{/admin/audit}" th:text="#{audit.admin.title}">Back</a></p>
</main>
<th:block th:replace="~{layout/base :: scripts}"></th:block>
</body>
</html>
