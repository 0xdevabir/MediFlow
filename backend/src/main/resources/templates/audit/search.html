<!DOCTYPE html>
<html th:lang="${#locale.language}" lang="en" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{layout/base :: head('audit.search.title')}"></head>
<body class="mf-app">
<a th:replace="~{layout/base :: skipLink}"></a>
<div th:replace="~{layout/base :: nav}"></div>
<main id="main" class="container mf-panel-wide mb-5">
  <div th:replace="~{layout/base :: flash}"></div>
  <div th:replace="~{layout/fragments/page-shell :: page-header(titleKey='audit.search.title', subtitleKey='audit.search.intro')}"></div>

  <form class="mf-panel row g-3 mb-4" method="get" th:action="@{/admin/audit/search}">
    <div class="col-md-4">
      <label class="form-label" for="actorUserId" th:text="#{audit.search.actor}">Actor</label>
      <input class="form-control" id="actorUserId" name="actorUserId" th:value="${actorUserId}"
             autocomplete="off" th:placeholder="#{audit.search.uuidHint}"/>
    </div>
    <div class="col-md-4">
      <label class="form-label" for="patientId" th:text="#{audit.search.patient}">Patient</label>
      <input class="form-control" id="patientId" name="patientId" th:value="${patientId}"
             autocomplete="off" th:placeholder="#{audit.search.uuidHint}"/>
    </div>
    <div class="col-md-4">
      <label class="form-label" for="action" th:text="#{audit.search.action}">Action</label>
      <input class="form-control" id="action" name="action" th:value="${action}"
             th:placeholder="#{audit.search.actionHint}"/>
    </div>
    <div class="col-md-3">
      <label class="form-label" for="from" th:text="#{audit.search.from}">From</label>
      <input class="form-control" id="from" type="date" name="from" th:value="${from}"/>
    </div>
    <div class="col-md-3">
      <label class="form-label" for="to" th:text="#{audit.search.to}">To</label>
      <input class="form-control" id="to" type="date" name="to" th:value="${to}"/>
    </div>
    <div class="col-md-6 d-flex align-items-end gap-2">
      <button class="btn btn-teal" type="submit" th:text="#{audit.search.submit}">Search</button>
      <a class="btn btn-outline-secondary" th:href="@{/admin/audit/search}" th:text="#{audit.search.clear}">Clear</a>
    </div>
  </form>

  <div th:if="${rows == null or rows.isEmpty()}"
       th:replace="~{layout/fragments/empty-state :: empty('audit.search.empty', 'audit.search.emptyHint')}"></div>

  <div class="table-responsive mf-panel p-0" th:unless="${rows == null or rows.isEmpty()}">
    <table class="table mf-data-table mf-table-stack align-middle mb-0">
      <thead>
      <tr>
        <th th:text="#{audit.search.seq}">Seq</th>
        <th th:text="#{audit.search.when}">When</th>
        <th th:text="#{audit.search.actorName}">Actor</th>
        <th th:text="#{audit.search.patientId}">Patient</th>
        <th th:text="#{audit.search.action}">Action</th>
        <th th:text="#{audit.search.resource}">Resource</th>
        <th th:text="#{audit.search.purpose}">Purpose</th>
        <th th:text="#{audit.search.outcome}">Outcome</th>
      </tr>
      </thead>
      <tbody>
      <tr th:each="r : ${rows}">
        <td th:attr="data-label=#{audit.search.seq}" th:text="${r.seq}">1</td>
        <td th:attr="data-label=#{audit.search.when}" th:text="${r.occurredAt}">t</td>
        <td th:attr="data-label=#{audit.search.actorName}" th:text="${r.actorName}">n</td>
        <td th:attr="data-label=#{audit.search.patientId}" th:text="${r.patientId}">p</td>
        <td th:attr="data-label=#{audit.search.action}" th:text="${r.action}">a</td>
        <td th:attr="data-label=#{audit.search.resource}">
          <span th:text="${r.resourceType}">T</span>
          <span th:if="${r.resourceId != null}" class="text-muted small" th:text="${r.resourceId}">id</span>
        </td>
        <td th:attr="data-label=#{audit.search.purpose}" th:text="${r.purpose}">p</td>
        <td th:attr="data-label=#{audit.search.outcome}" th:text="${r.outcome}">o</td>
      </tr>
      </tbody>
    </table>
  </div>

  <p class="mt-4"><a th:href="@{/admin/audit}" th:text="#{audit.admin.back}">Back to audit</a></p>
</main>
<th:block th:replace="~{layout/base :: scripts}"></th:block>
</body>
</html>
