<!DOCTYPE html>
<html th:lang="${#locale.language}" lang="en" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{layout/base :: head('clinical.consult.list.title')}"></head>
<body class="mf-app">
<a th:replace="~{layout/base :: skipLink}"></a>
<div th:replace="~{layout/base :: nav}"></div>
<main id="main" class="container mb-5">
  <div th:replace="~{layout/base :: flash}"></div>
  <header class="mb-4 d-flex flex-wrap justify-content-between align-items-center gap-2">
    <h1 class="mf-page-title mb-0" th:text="#{clinical.consult.list.title}">Consultations</h1>
    <span th:if="${labBadgeCount != null and labBadgeCount > 0}"
          th:replace="~{layout/fragments/status-badge :: badge(level='URGENT', label=#{clinical.consult.labBadge(${labBadgeCount})})}"></span>
  </header>

  <div th:if="${#lists.isEmpty(encounters)}"
       th:replace="~{layout/fragments/empty-state :: empty(titleKey='clinical.consult.none', bodyKey=null)}"></div>

  <div class="mf-panel" th:if="${!#lists.isEmpty(encounters)}">
    <table class="table table-hover mf-table mb-0">
      <thead>
      <tr>
        <th th:text="#{clinical.consult.encounter}">Encounter</th>
        <th th:text="#{clinical.consult.patient}">Patient</th>
        <th th:text="#{clinical.consult.started}">Started</th>
        <th></th>
      </tr>
      </thead>
      <tbody>
      <tr th:each="e : ${encounters}">
        <td class="small" th:text="${e.id}"></td>
        <td class="small" th:text="${e.patientId}"></td>
        <td class="small" th:text="${e.startedAt}"></td>
        <td>
          <a class="btn btn-sm btn-teal" th:href="@{/clinical/consultations/{id}(id=${e.id})}"
             th:text="#{clinical.consult.open}">Open</a>
        </td>
      </tr>
      </tbody>
    </table>
  </div>
</main>
<th:block th:replace="~{layout/base :: scripts}"></th:block>
</body>
</html>
