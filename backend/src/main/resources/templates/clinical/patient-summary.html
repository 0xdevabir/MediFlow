<!DOCTYPE html>
<html th:lang="${#locale.language}" lang="en" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{layout/base :: head('clinical.consult.summary.title')}"></head>
<body class="mf-app">
<a th:replace="~{layout/base :: skipLink}"></a>
<div th:replace="~{layout/base :: nav}"></div>
<main id="main" class="container mf-panel-narrow mb-5">
  <div th:replace="~{layout/base :: flash}"></div>
  <div th:replace="~{layout/fragments/page-shell :: page-header(titleKey='clinical.consult.summary.title', subtitleKey=null)}"></div>
  <section class="mf-panel p-3">
    <pre class="mb-0" style="white-space: pre-wrap" th:text="${summary}">Summary</pre>
  </section>
  <a class="btn btn-outline-secondary mt-3"
     th:href="@{/clinical/consultations/{id}(id=${encounterId})}"
     th:text="#{clinical.consult.open}">Back</a>
</main>
<th:block th:replace="~{layout/base :: scripts}"></th:block>
</body>
</html>
