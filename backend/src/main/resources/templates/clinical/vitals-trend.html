<!DOCTYPE html>
<html th:lang="${#locale.language}" lang="en" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{layout/base :: head('clinical.vitals.trend.title')}"></head>
<body class="mf-app">
<a th:replace="~{layout/base :: skipLink}"></a>
<div th:replace="~{layout/base :: nav}"></div>
<main id="main" class="container mb-5">
  <div th:replace="~{layout/base :: flash}"></div>
  <div th:replace="~{layout/fragments/page-shell :: page-header(titleKey='clinical.vitals.trend.title', subtitleKey=null)}"></div>

  <form method="get" class="row g-2 mb-3 align-items-end mf-panel p-3">
    <div class="col-auto">
      <label class="form-label" for="type" th:text="#{clinical.consult.vitalsTrend}">Type</label>
      <select id="type" name="type" class="form-select">
        <option th:each="t : ${types}" th:value="${t.code()}" th:text="${t.displayEn()}"
                th:selected="${t.code() == type}"></option>
      </select>
    </div>
    <div class="col-auto">
      <label class="form-label" for="days" th:text="#{clinical.days}">Days</label>
      <input id="days" type="number" min="1" max="90" name="days" class="form-control" th:value="${days}"/>
    </div>
    <div class="col-auto">
      <button class="btn btn-teal" type="submit" th:text="#{clinical.vitals.trend.show}">Show</button>
    </div>
  </form>

  <div th:if="${#lists.isEmpty(points)}"
       th:replace="~{layout/fragments/empty-state :: empty(titleKey='clinical.consult.none', bodyKey=null)}"></div>

  <section class="mf-panel p-3" th:if="${!#lists.isEmpty(points)}">
    <canvas id="vitalsTrendChart" height="140" aria-label="Trend chart"></canvas>
    <!-- CSS sparkline fallback if Chart.js fails to load -->
    <svg class="d-none" id="vitalsSpark" viewBox="0 0 640 200" width="100%" height="120"
         aria-hidden="true">
      <polyline fill="none" stroke="#0f766e" stroke-width="2"
                th:points="${T(com.mediflow.clinical.vitals.web.TrendSvg).polyline(points, 640, 200)}"/>
    </svg>
  </section>

  <table class="table table-sm mf-table mt-3" th:if="${!#lists.isEmpty(points)}">
    <thead>
    <tr>
      <th th:text="#{clinical.consult.started}">When</th>
      <th>Value</th>
      <th th:text="#{clinical.consult.level}">Class</th>
    </tr>
    </thead>
    <tbody>
    <tr th:each="p : ${points}">
      <td th:text="${p.recordedAt}"></td>
      <td>
        <span th:text="${p.valueText != null ? p.valueText : p.valueNumeric}"></span>
        <span class="text-muted" th:text="${p.unit}"></span>
      </td>
      <td>
        <span th:replace="~{layout/fragments/status-badge :: badge(level=${p.classification.name() == 'CRITICAL'} ? 'CRITICAL' : (${p.classification.name() == 'BORDERLINE'} ? 'URGENT' : 'NORMAL'), label=${p.classification})}"></span>
      </td>
    </tr>
    </tbody>
  </table>
</main>
<th:block th:replace="~{layout/base :: scripts}"></th:block>
<script th:src="@{/webjars/chart.js/4.4.4/dist/chart.umd.js}"></script>
<script th:inline="javascript">
(function () {
  const points = /*[[${points}]]*/ [];
  const canvas = document.getElementById('vitalsTrendChart');
  const spark = document.getElementById('vitalsSpark');
  if (!canvas) return;
  if (!window.Chart) {
    if (spark) spark.classList.remove('d-none');
    canvas.classList.add('d-none');
    return;
  }
  const labels = (points || []).map(p => p.recordedAt);
  const values = (points || []).map(p => p.valueNumeric);
  new Chart(canvas, {
    type: 'line',
    data: {
      labels,
      datasets: [{
        label: /*[[${type}]]*/ 'HR',
        data: values,
        borderColor: '#0f766e',
        backgroundColor: 'rgba(15,118,110,0.12)',
        tension: 0.25,
        pointRadius: 3
      }]
    },
    options: {
      responsive: true,
      plugins: { legend: { display: false } },
      scales: { y: { beginAtZero: false } }
    }
  });
})();
</script>
</body>
</html>
