<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{layout/base :: head('directory.admin.departments')}"></head>
<body class="bg-light">
<div th:replace="~{layout/base :: nav}"></div>
<main class="container mb-5" style="max-width: 640px;">
  <div th:replace="~{layout/base :: flash}"></div>
  <h1 class="h4 mb-3" th:text="#{directory.admin.departments}">Department</h1>
  <form th:action="@{/directory/admin/departments}" method="post" class="border rounded p-3 bg-white">
    <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>
    <input type="hidden" name="id" th:if="${department != null}" th:value="${department.id()}"/>
    <div class="mb-3">
      <label class="form-label" for="hospitalId" th:text="#{directory.search.hospital}">Hospital</label>
      <select class="form-select" id="hospitalId" name="hospitalId" required>
        <option th:each="h : ${allHospitals}" th:value="${h.id()}" th:text="${h.name()}"
                th:selected="${department != null and department.hospitalId().equals(h.id())}"></option>
      </select>
    </div>
    <div class="mb-3">
      <label class="form-label" for="name" th:text="#{directory.tests.name}">Name</label>
      <input class="form-control" id="name" name="name" required th:value="${department != null ? department.name() : ''}"/>
    </div>
    <div class="form-check mb-3">
      <input class="form-check-input" type="checkbox" id="clinical" name="clinical" value="true"
             th:checked="${department == null or department.clinical()}"/>
      <label class="form-check-label" for="clinical" th:text="#{directory.admin.clinical}">Clinical</label>
    </div>
    <div class="d-flex gap-2">
      <button class="btn btn-teal" type="submit" th:text="#{directory.admin.save}">Save</button>
      <a class="btn btn-outline-secondary" th:href="@{/directory/admin}" th:text="#{directory.admin.cancel}">Cancel</a>
    </div>
  </form>
</main>
<th:block th:replace="~{layout/base :: scripts}"></th:block>
</body>
</html>
