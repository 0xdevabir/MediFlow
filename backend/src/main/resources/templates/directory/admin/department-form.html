<!DOCTYPE html>
<html th:lang="${#locale.language}" lang="en" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{layout/base :: head('directory.admin.departments')}"></head>
<body class="mf-app">
<a th:replace="~{layout/base :: skipLink}"></a>
<div th:replace="~{layout/base :: nav}"></div>
<main id="main" class="container mf-panel-narrow mb-5">
  <div th:replace="~{layout/base :: flash}"></div>
  <header class="mb-4">
    <h1 class="mf-page-title" th:text="#{directory.admin.departments}">Department</h1>
  </header>
  <form th:action="@{/directory/admin/departments}" method="post" class="mf-panel">
    <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>
    <input type="hidden" name="id" th:if="${department != null}" th:value="${department.id()}"/>
    <div class="mb-3">
      <label class="form-label" for="hospitalId" th:text="#{directory.search.hospital}">Hospital</label>
      <select class="form-select" id="hospitalId" name="hospitalId" required>
        <option th:each="h : ${allHospitals}" th:value="${h.id()}" th:text="${h.name()}"
                th:selected="${department != null and department.hospitalId().equals(h.id())}"></option>
      </select>
    </div>
    <div class="mb-3">
      <label class="form-label" for="name" th:text="#{directory.tests.name}">Name</label>
      <input class="form-control" id="name" name="name" required
             th:value="${department != null ? department.name() : ''}"/>
    </div>
    <div class="form-check mb-4">
      <input class="form-check-input" type="checkbox" id="clinical" name="clinical" value="true"
             th:checked="${department == null or department.clinical()}"/>
      <label class="form-check-label" for="clinical" th:text="#{directory.admin.clinical}">Clinical</label>
    </div>
    <div class="d-flex flex-wrap gap-2">
      <button class="btn btn-teal" type="submit" th:text="#{directory.admin.save}">Save</button>
      <a class="btn btn-outline-secondary" th:href="@{/directory/admin}"
         th:text="#{directory.admin.cancel}">Cancel</a>
    </div>
  </form>
</main>
<th:block th:replace="~{layout/base :: scripts}"></th:block>
</body>
</html>
