<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{layout/base :: head('directory.admin.hospitals')}"></head>
<body class="bg-light">
<div th:replace="~{layout/base :: nav}"></div>
<main class="container mb-5" style="max-width: 640px;">
  <div th:replace="~{layout/base :: flash}"></div>
  <h1 class="h4 mb-3" th:text="#{directory.admin.hospitals}">Hospital</h1>
  <form th:action="@{/directory/admin/hospitals}" method="post" class="border rounded p-3 bg-white">
    <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>
    <input type="hidden" name="id" th:if="${hospital != null}" th:value="${hospital.id()}"/>
    <div class="mb-3">
      <label class="form-label" for="name" th:text="#{directory.tests.name}">Name</label>
      <input class="form-control" id="name" name="name" required th:value="${hospital != null ? hospital.name() : ''}"/>
    </div>
    <div class="mb-3">
      <label class="form-label" for="type">Type</label>
      <input class="form-control" id="type" name="type" th:value="${hospital != null ? hospital.type() : ''}"/>
    </div>
    <div class="mb-3">
      <label class="form-label" for="address" th:text="#{directory.hospital.address}">Address</label>
      <textarea class="form-control" id="address" name="address" rows="2" th:text="${hospital != null ? hospital.address() : ''}"></textarea>
    </div>
    <div class="mb-3">
      <label class="form-label" for="openingHours" th:text="#{directory.hospital.hours}">Hours</label>
      <input class="form-control" id="openingHours" name="openingHours" th:value="${hospital != null ? hospital.openingHours() : ''}"/>
    </div>
    <div class="row">
      <div class="col-md-4 mb-3">
        <label class="form-label" for="phone" th:text="#{directory.hospital.phone}">Phone</label>
        <input class="form-control" id="phone" name="phone" th:value="${hospital != null ? hospital.phone() : ''}"/>
      </div>
      <div class="col-md-4 mb-3">
        <label class="form-label" for="emergencyPhone" th:text="#{directory.hospital.emergency}">Emergency</label>
        <input class="form-control" id="emergencyPhone" name="emergencyPhone" th:value="${hospital != null ? hospital.emergencyPhone() : ''}"/>
      </div>
      <div class="col-md-4 mb-3">
        <label class="form-label" for="ambulancePhone" th:text="#{directory.admin.ambulance}">Ambulance</label>
        <input class="form-control" id="ambulancePhone" name="ambulancePhone" th:value="${hospital != null ? hospital.ambulancePhone() : ''}"/>
      </div>
    </div>
    <div class="mb-3">
      <label class="form-label" for="parentId" th:text="#{directory.admin.parent}">Parent</label>
      <select class="form-select" id="parentId" name="parentId">
        <option value="">—</option>
        <option th:each="h : ${allHospitals}"
                th:if="${hospital == null or !h.id().equals(hospital.id())}"
                th:value="${h.id()}" th:text="${h.name()}"
                th:selected="${hospital != null and hospital.parentId() != null and hospital.parentId().equals(h.id())}"></option>
      </select>
    </div>
    <div class="form-check mb-3">
      <input class="form-check-input" type="checkbox" id="active" name="active" value="true"
             th:checked="${hospital == null or hospital.active()}"/>
      <label class="form-check-label" for="active" th:text="#{directory.admin.active}">Active</label>
    </div>
    <div class="d-flex gap-2">
      <button class="btn btn-teal" type="submit" th:text="#{directory.admin.save}">Save</button>
      <a class="btn btn-outline-secondary" th:href="@{/directory/admin}" th:text="#{directory.admin.cancel}">Cancel</a>
    </div>
  </form>
</main>
<th:block th:replace="~{layout/base :: scripts}"></th:block>
</body>
</html>
