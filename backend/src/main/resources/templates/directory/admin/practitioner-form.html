<!DOCTYPE html>
<html th:lang="${#locale.language}" lang="en" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{layout/base :: head('directory.admin.practitioners')}"></head>
<body class="mf-app">
<a th:replace="~{layout/base :: skipLink}"></a>
<div th:replace="~{layout/base :: nav}"></div>
<main id="main" class="container mf-panel-narrow mb-5">
  <div th:replace="~{layout/base :: flash}"></div>
  <header class="mb-4">
    <h1 class="mf-page-title" th:text="#{directory.admin.practitioners}">Practitioner</h1>
  </header>
  <form th:action="@{/directory/admin/practitioners}" method="post" class="mf-panel">
    <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>
    <input type="hidden" name="id" th:if="${practitioner != null}" th:value="${practitioner.id()}"/>
    <div class="mb-3">
      <label class="form-label" for="name" th:text="#{directory.tests.name}">Name</label>
      <input class="form-control" id="name" name="name" required
             th:value="${practitioner != null ? practitioner.name() : ''}"/>
    </div>
    <div class="mb-3">
      <label class="form-label" for="roleLabel" th:text="#{directory.admin.roleLabel}">Role label</label>
      <input class="form-control" id="roleLabel" name="roleLabel"
             th:value="${practitioner != null ? practitioner.roleLabel() : 'Doctor'}"/>
    </div>
    <div class="mb-3">
      <label class="form-label" for="licenceNo" th:text="#{directory.admin.licenceNo}">Licence no</label>
      <input class="form-control" id="licenceNo" name="licenceNo"
             th:value="${practitioner != null ? practitioner.licenceNo() : ''}"/>
    </div>
    <div class="mb-3">
      <label class="form-label" for="specialty" th:text="#{directory.admin.specialty}">Specialty</label>
      <input class="form-control" id="specialty" name="specialty"
             th:value="${practitioner != null ? practitioner.specialty() : ''}"/>
    </div>
    <div class="mb-4">
      <label class="form-label" for="userId" th:text="#{directory.admin.userId}">Linked user id</label>
      <input class="form-control" id="userId" name="userId"
             th:value="${practitioner != null and practitioner.userId() != null ? practitioner.userId() : ''}"/>
    </div>
    <div class="d-flex flex-wrap gap-2">
      <button class="btn btn-teal" type="submit" th:text="#{directory.admin.save}">Save</button>
      <a class="btn btn-outline-secondary" th:href="@{/directory/admin}"
         th:text="#{directory.admin.cancel}">Cancel</a>
    </div>
  </form>
</main>
<th:block th:replace="~{layout/base :: scripts}"></th:block>
</body>
</html>
