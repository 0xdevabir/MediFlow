<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{layout/base :: head('directory.admin.roles')}"></head>
<body class="bg-light">
<div th:replace="~{layout/base :: nav}"></div>
<main class="container mb-5" style="max-width: 720px;">
  <div th:replace="~{layout/base :: flash}"></div>
  <h1 class="h4 mb-3" th:text="#{directory.admin.roles}">Doctor role</h1>
  <form th:action="@{/directory/admin/roles}" method="post" class="border rounded p-3 bg-white">
    <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>
    <input type="hidden" name="id" th:if="${role != null}" th:value="${role.roleId()}"/>
    <div class="mb-3">
      <label class="form-label" for="practitionerId" th:text="#{directory.admin.practitioners}">Practitioner</label>
      <select class="form-select" id="practitionerId" name="practitionerId" required>
        <option th:each="p : ${practitioners}" th:value="${p.id()}" th:text="${p.name()}"
                th:selected="${role != null and role.practitionerId().equals(p.id())}"></option>
      </select>
    </div>
    <div class="mb-3">
      <label class="form-label" for="hospitalId" th:text="#{directory.search.hospital}">Hospital</label>
      <select class="form-select" id="hospitalId" name="hospitalId" required>
        <option th:each="h : ${hospitals}" th:value="${h.id()}" th:text="${h.name()}"
                th:selected="${role != null and role.hospitalId().equals(h.id())}"></option>
      </select>
    </div>
    <div class="mb-3">
      <label class="form-label" for="departmentId" th:text="#{directory.search.department}">Department</label>
      <select class="form-select" id="departmentId" name="departmentId" required>
        <option th:each="d : ${departments}" th:value="${d.id()}"
                th:text="${d.hospitalName() + ' — ' + d.name()}"
                th:selected="${role != null and role.departmentId().equals(d.id())}"></option>
      </select>
    </div>
    <div class="mb-3">
      <label class="form-label" for="schedule" th:text="#{directory.admin.schedule}">Schedule</label>
      <textarea class="form-control font-monospace" id="schedule" name="schedule" rows="6"
                th:text="${role != null ? role.schedule() : '[]'}"></textarea>
      <div class="form-text" th:text="#{directory.admin.schedule.help}">JSON help</div>
    </div>
    <div class="form-check mb-3">
      <input class="form-check-input" type="checkbox" id="active" name="active" value="true"
             th:checked="${role == null or role.active()}"/>
      <label class="form-check-label" for="active" th:text="#{directory.admin.active}">Active</label>
    </div>
    <div class="d-flex gap-2">
      <button class="btn btn-teal" type="submit" th:text="#{directory.admin.save}">Save</button>
      <a class="btn btn-outline-secondary" th:href="@{/directory/admin}" th:text="#{directory.admin.cancel}">Cancel</a>
    </div>
  </form>
</main>
<th:block th:replace="~{layout/base :: scripts}"></th:block>
</body>
</html>
