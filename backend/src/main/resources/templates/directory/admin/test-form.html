<!DOCTYPE html>
<html th:lang="${#locale.language}" lang="en" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{layout/base :: head('directory.admin.tests')}"></head>
<body class="mf-app">
<a th:replace="~{layout/base :: skipLink}"></a>
<div th:replace="~{layout/base :: nav}"></div>
<main id="main" class="container mf-panel-narrow mb-5">
  <div th:replace="~{layout/base :: flash}"></div>
  <header class="mb-4">
    <h1 class="mf-page-title" th:text="#{directory.admin.tests}">Lab test</h1>
  </header>
  <form th:action="@{/directory/admin/tests}" method="post" class="mf-panel">
    <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>
    <input type="hidden" name="id" th:if="${test != null}" th:value="${test.id}"/>
    <div class="mb-3">
      <label class="form-label" for="code" th:text="#{directory.tests.code}">Code</label>
      <input class="form-control" id="code" name="code" required
             th:value="${test != null ? test.code : ''}"/>
    </div>
    <div class="mb-3">
      <label class="form-label" for="name" th:text="#{directory.tests.name}">Name</label>
      <input class="form-control" id="name" name="name" required
             th:value="${test != null ? test.name : ''}"/>
    </div>
    <div class="mb-3">
      <label class="form-label" for="loincCode" th:text="#{directory.tests.loinc}">LOINC</label>
      <input class="form-control" id="loincCode" name="loincCode"
             th:value="${test != null ? test.loincCode : ''}"/>
    </div>
    <div class="mb-3">
      <label class="form-label" for="price" th:text="#{directory.tests.price}">Price</label>
      <input class="form-control" type="number" step="0.01" min="0" id="price" name="price"
             th:value="${test != null ? test.price : ''}"/>
      <div class="form-text" th:text="#{directory.tests.costNote}">Cost note</div>
    </div>
    <div class="form-check mb-2">
      <input class="form-check-input" type="checkbox" id="directAllowed" name="directAllowed" value="true"
             th:checked="${test != null and test.directAllowed}"/>
      <label class="form-check-label" for="directAllowed" th:text="#{directory.admin.directAllowed}">Direct</label>
    </div>
    <div class="form-check mb-4">
      <input class="form-check-input" type="checkbox" id="active" name="active" value="true"
             th:checked="${test == null or test.active}"/>
      <label class="form-check-label" for="active" th:text="#{directory.admin.active}">Active</label>
    </div>
    <div class="d-flex flex-wrap gap-2">
      <button class="btn btn-teal" type="submit" th:text="#{directory.admin.save}">Save</button>
      <a class="btn btn-outline-secondary" th:href="@{/directory/admin}"
         th:text="#{directory.admin.cancel}">Cancel</a>
    </div>
  </form>
</main>
<th:block th:replace="~{layout/base :: scripts}"></th:block>
</body>
</html>
