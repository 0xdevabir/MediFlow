<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{layout/base :: head('directory.tests.title')}"></head>
<body class="bg-light">
<div th:replace="~{layout/base :: nav}"></div>
<main class="container mb-5">
  <div th:replace="~{layout/base :: flash}"></div>
  <div class="d-flex justify-content-between align-items-center mb-3">
    <h1 class="h3 mb-0" th:text="#{directory.tests.title}">Direct lab tests</h1>
    <a class="btn btn-outline-secondary btn-sm" th:href="@{/directory/search}" th:text="#{directory.search.back}">Back to search</a>
  </div>
  <p class="text-muted" th:text="#{directory.tests.intro}">Book without a doctor referral. Prices shown before booking.</p>

  <form class="row g-2 align-items-end mb-4" method="get" th:action="@{/directory/tests}">
    <div class="col-md-4">
      <label class="form-label" for="hospitalId" th:text="#{directory.search.hospital}">Hospital</label>
      <select class="form-select" id="hospitalId" name="hospitalId">
        <option value="" th:text="#{directory.search.any}">Any</option>
        <option th:each="h : ${hospitals}" th:value="${h.id()}" th:text="${h.label()}"
                th:selected="${hospitalId != null and hospitalId.equals(h.id())}"></option>
      </select>
    </div>
    <div class="col-md-2">
      <button class="btn btn-teal" type="submit" th:text="#{directory.search.submit}">Filter</button>
    </div>
  </form>

  <section class="mb-4">
    <h2 class="h5" th:text="#{directory.tests.list}">Approved direct tests</h2>
    <div class="table-responsive">
      <table class="table table-sm align-middle bg-white">
        <thead>
        <tr>
          <th th:text="#{directory.tests.code}">Code</th>
          <th th:text="#{directory.tests.name}">Name</th>
          <th th:text="#{directory.tests.loinc}">LOINC</th>
          <th class="text-end" th:text="#{directory.tests.price}">Price</th>
        </tr>
        </thead>
        <tbody>
        <tr th:each="t : ${directTests}">
          <td th:text="${t.code()}"></td>
          <td th:text="${t.name()}"></td>
          <td th:text="${t.loincCode()}"></td>
          <td class="text-end" th:text="${t.price()}"></td>
        </tr>
        </tbody>
      </table>
    </div>
  </section>

  <section>
    <h2 class="h5" th:text="#{directory.packages.heading}">Packages</h2>
    <p class="text-muted" th:if="${packages.isEmpty()}" th:text="#{directory.packages.empty}">No packages.</p>
    <div class="row g-3">
      <div class="col-md-6" th:each="p : ${packages}">
        <article class="border rounded p-3 bg-white h-100">
          <h3 class="h6 mb-1" th:text="${p.name()}">Package</h3>
          <p class="small text-muted mb-2">
            <span th:if="${p.hospitalName() != null}" th:text="${p.hospitalName()}"></span>
            <span th:if="${p.hospitalName() == null}" th:text="#{directory.packages.allHospitals}">All hospitals</span>
            <span> · </span>
            <span th:text="${p.price()}"></span>
          </p>
          <ul class="small mb-0">
            <li th:each="t : ${p.tests()}" th:text="${t.name() + ' (' + t.code() + ')'}"></li>
          </ul>
        </article>
      </div>
    </div>
  </section>
</main>
<th:block th:replace="~{layout/base :: scripts}"></th:block>
</body>
</html>
