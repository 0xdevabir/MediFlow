<!DOCTYPE html>
<html th:lang="${#locale.language}" lang="en" xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head th:replace="~{layout/base :: head('er.detail.title')}"></head>
<body class="mf-app">
<a th:replace="~{layout/base :: skipLink}"></a>
<div th:replace="~{layout/base :: nav}"></div>
<main id="main" class="container mf-panel-narrow mb-5">
  <div th:replace="~{layout/base :: flash}"></div>
  <div th:replace="~{layout/fragments/page-shell :: page-header(titleKey='er.detail.title', subtitleKey='er.detail.subtitle')}"></div>

  <div class="mf-panel mb-4 p-3 border-start border-4 border-danger">
    <dl class="row mb-0">
      <dt class="col-sm-3" th:text="#{er.detail.patient}">Patient</dt>
      <dd class="col-sm-9" th:if="${patient != null}"
          th:text="${patient.givenName + ' ' + patient.familyName + ' · MRN ' + patient.mrn}">Name</dd>
      <dt class="col-sm-3" th:text="#{er.detail.level}">Level</dt>
      <dd class="col-sm-9">
        <span th:replace="~{layout/fragments/status-badge :: badge(${alert.level}, ${alert.level})}"></span>
      </dd>
      <dt class="col-sm-3" th:text="#{er.detail.raised}">Raised</dt>
      <dd class="col-sm-9" th:text="${alert.raisedAt}">t</dd>
      <dt class="col-sm-3" th:text="#{er.detail.reason}">Reason</dt>
      <dd class="col-sm-9" th:text="${alert.reason}">r</dd>
      <dt class="col-sm-3" th:text="#{er.detail.assignee}">Assignee</dt>
      <dd class="col-sm-9" th:text="${assigneeName != null ? assigneeName : (ext != null ? ext.assignedErUserId() : '—')}">—</dd>
      <dt class="col-sm-3" th:text="#{er.detail.acknowledged}">Acknowledged</dt>
      <dd class="col-sm-9" th:text="${alert.acknowledgedAt != null ? alert.acknowledgedAt : '—'}">—</dd>
      <dt class="col-sm-3" th:text="#{er.detail.handoverStatus}">Handover</dt>
      <dd class="col-sm-9" th:text="${alert.handoverStatus != null ? alert.handoverStatus : '—'}">—</dd>
    </dl>
  </div>

  <div class="d-flex flex-column gap-3" sec:authorize="hasRole('ER')" th:if="${alert.handoverStatus == null}">
    <form method="post" th:action="@{/er/{id}/acknowledge(id=${alert.id})}">
      <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">
      <button class="btn btn-outline-primary w-100 w-md-auto" type="submit"
              th:text="#{er.detail.acknowledge}">Ack</button>
    </form>
    <form class="row g-2 align-items-end" method="post" th:action="@{/er/{id}/handover(id=${alert.id})}">
      <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">
      <div class="col-12 col-md-4">
        <label class="form-label" for="er-handover-status" th:text="#{er.detail.status}">Outcome</label>
        <select class="form-select" id="er-handover-status" name="status" required>
          <option value="ADMITTED" th:text="#{er.detail.admitted}">Admitted</option>
          <option value="REFERRED" th:text="#{er.detail.referred}">Referred</option>
          <option value="DISCHARGED" th:text="#{er.detail.discharged}">Discharged</option>
        </select>
      </div>
      <div class="col-12 col-md-5">
        <label class="form-label" for="er-handover-note" th:text="#{er.detail.note}">Note</label>
        <input class="form-control" id="er-handover-note" name="note" th:placeholder="#{er.detail.note}">
      </div>
      <div class="col-12 col-md-3">
        <button class="btn btn-danger w-100" type="submit" th:text="#{er.detail.handover}">Handover</button>
      </div>
    </form>
  </div>

  <a class="btn btn-link mt-3" th:href="@{/er}" th:text="#{er.detail.back}">← Board</a>
</main>
<th:block th:replace="~{layout/base :: scripts}"></th:block>
</body>
</html>
