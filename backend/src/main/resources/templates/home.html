<!DOCTYPE html>
<html th:lang="${#locale.language}" lang="en" xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head th:replace="~{layout/base :: head('home.title')}"></head>
<body class="mf-app">
<a th:replace="~{layout/base :: skipLink}"></a>
<div th:replace="~{layout/base :: nav}"></div>
<main id="main" class="container mb-5">
  <div th:replace="~{layout/base :: flash}"></div>
  <header class="mb-4">
    <h1 class="mf-page-title" th:text="#{home.title}">Home</h1>
    <p class="mf-page-subtitle" th:text="#{home.lead}">Welcome to MediFlow AI.</p>
  </header>

  <!-- PATIENT -->
  <section th:if="${isPatient}" class="mb-5" aria-labelledby="home-patient">
    <h2 id="home-patient" class="h5 mb-3" th:text="#{home.section.patient}">Your care</h2>
    <div th:replace="~{patient/fragments :: dashboard}"></div>
    <div class="mf-role-grid mt-3">
      <div th:replace="~{lab/home-tiles :: patient}"></div>
    </div>
  </section>

  <!-- FRONT DESK -->
  <section th:if="${isFrontDesk}" class="mb-5" aria-labelledby="home-fd">
    <h2 id="home-fd" class="h5 mb-3" th:text="#{home.section.frontDesk}">Front desk today</h2>
    <div class="mf-role-grid">
      <div th:replace="~{appointment/home-tiles :: frontDesk}"></div>
      <div th:replace="~{lab/home-tiles :: frontDesk}"></div>
    </div>
  </section>

  <!-- NURSE -->
  <section th:if="${isNurse}" class="mb-5" aria-labelledby="home-nurse">
    <h2 id="home-nurse" class="h5 mb-3" th:text="#{home.section.nurse}">Nursing worklist</h2>
    <div class="mf-role-grid">
      <div th:replace="~{appointment/home-tiles :: nurse}"></div>
    </div>
    <th:block th:replace="~{clinical/home-tiles :: nurseTiles}"></th:block>
  </section>

  <!-- DOCTOR -->
  <section th:if="${isDoctor}" class="mb-5" aria-labelledby="home-doctor">
    <h2 id="home-doctor" class="h5 mb-3" th:text="#{home.section.doctor}">Clinic today</h2>
    <div class="mf-role-grid">
      <div th:replace="~{appointment/home-tiles :: doctor}"></div>
      <div th:replace="~{prescription/home-tiles :: doctor}"></div>
    </div>
    <th:block th:replace="~{clinical/home-tiles :: doctorTiles}"></th:block>
  </section>

  <!-- ER -->
  <section th:if="${isEr}" class="mb-5" aria-labelledby="home-er">
    <h2 id="home-er" class="h5 mb-3" th:text="#{home.section.er}">Emergency board</h2>
    <div class="mf-role-grid">
      <div th:replace="~{appointment/home-tiles :: er}"></div>
    </div>
  </section>

  <!-- LAB TECH -->
  <section th:if="${isLabTech}" class="mb-5" aria-labelledby="home-lab">
    <h2 id="home-lab" class="h5 mb-3" th:text="#{home.section.lab}">Lab queue</h2>
    <div class="mf-role-grid">
      <div th:replace="~{lab/home-tiles :: labTech}"></div>
    </div>
  </section>

  <!-- PHARMACIST -->
  <section th:if="${isPharmacist}" class="mb-5" aria-labelledby="home-pharm">
    <h2 id="home-pharm" class="h5 mb-3" th:text="#{home.section.pharmacy}">Dispense desk</h2>
    <div class="mf-role-grid">
      <th:block th:replace="~{pharmacy/home-tiles :: tiles}"></th:block>
    </div>
  </section>

  <!-- ADMIN (full hub; not the approver-only strip) -->
  <section th:if="${isAdmin}" class="mb-5" aria-labelledby="home-admin">
    <h2 id="home-admin" class="h5 mb-3" th:text="#{home.section.admin}">Administration</h2>
    <div class="mf-role-grid mf-role-grid-3">
      <div th:replace="~{directory/fragments/home-tiles :: admin}"></div>
      <div th:replace="~{identity/fragments :: admin-staff-tile}"></div>
      <div class="mf-tile">
        <h3 class="mf-tile-title" th:text="#{admin.home.adminTitle}">Administration</h3>
        <p class="mf-tile-meta" th:text="#{admin.home.adminBody}">Directory, staff, settings, audit</p>
        <a class="btn btn-sm btn-teal" th:href="@{/admin}" th:text="#{home.cta.open}">Open</a>
      </div>
    </div>
  </section>

  <!-- CLINICAL APPROVER — dual-approval queue only (no admin PHI tiles) -->
  <section th:if="${isApprover and !isAdmin}" class="mb-5" aria-labelledby="home-approver">
    <h2 id="home-approver" class="h5 mb-3" th:text="#{home.section.approver}">Dual approvals</h2>
    <div class="mf-role-grid">
      <th:block th:replace="~{admin/home-tiles :: approver}"></th:block>
    </div>
  </section>

  <p class="text-muted small"
     th:unless="${isPatient or isFrontDesk or isNurse or isDoctor or isEr or isLabTech or isPharmacist or isAdmin or isApprover}"
     th:text="#{home.hint}">Use the navigation to open modules.</p>
</main>
<th:block th:replace="~{layout/base :: scripts}"></th:block>
</body>
</html>
