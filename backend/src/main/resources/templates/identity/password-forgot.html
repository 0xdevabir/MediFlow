<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{layout/base :: head('identity.password.forgot.title')}"></head>
<body class="bg-light">
<main class="container" style="max-width: 420px; margin-top: 4rem;">
  <h1 class="h3 mb-3 text-center" th:text="#{app.name}">MediFlow</h1>
  <div th:replace="~{layout/base :: flash}"></div>
  <form th:action="@{/identity/password/forgot}" method="post" class="card card-body shadow-sm">
    <h2 class="h5 mb-3" th:text="#{identity.password.forgot.title}">Forgot password</h2>
    <p class="small text-muted" th:text="#{identity.password.forgot.intro}">Enter your username; we will e-mail a reset link.</p>
    <label class="form-label" for="username" th:text="#{login.username}">Username</label>
    <input class="form-control mb-3" id="username" name="username" required autofocus maxlength="100"/>
    <button class="btn btn-teal w-100" type="submit" th:text="#{identity.password.forgot.submit}">Send reset link</button>
  </form>
  <p class="text-center mt-3"><a th:href="@{/login}" th:text="#{identity.password.backToLogin}">Back to sign in</a></p>
</main>
<th:block th:replace="~{layout/base :: scripts}"></th:block>
</body>
</html>
