<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{layout/base :: head('identity.password.reset.title')}"></head>
<body class="bg-light">
<main class="container" style="max-width: 420px; margin-top: 4rem;">
  <h1 class="h3 mb-3 text-center" th:text="#{app.name}">MediFlow</h1>
  <div th:if="${!tokenValid}" class="alert alert-danger">
    <span th:text="#{identity.password.reset.invalidToken}">This link is invalid or has expired.</span>
    <a th:href="@{/identity/password/forgot}" th:text="#{identity.password.reset.requestNew}">Request a new link</a>
  </div>
  <form th:if="${tokenValid}" th:action="@{/identity/password/reset}" method="post" class="card card-body shadow-sm">
    <h2 class="h5 mb-3" th:text="#{identity.password.reset.title}">Choose a new password</h2>
    <div th:if="${!violations.isEmpty()}" class="alert alert-danger">
      <ul class="mb-0"><li th:each="v : ${violations}" th:text="#{${v}}">rule</li></ul>
    </div>
    <p class="small text-muted" th:text="#{identity.password.reset.rules}">At least 12 characters, letters and digits.</p>
    <input type="hidden" name="token" th:value="${token}"/>
    <label class="form-label" for="password" th:text="#{identity.password.reset.new}">New password</label>
    <input class="form-control mb-3" type="password" id="password" name="password" required minlength="12" maxlength="128" autocomplete="new-password"/>
    <label class="form-label" for="confirm" th:text="#{identity.password.reset.confirm}">Confirm password</label>
    <input class="form-control mb-3" type="password" id="confirm" name="confirm" required autocomplete="new-password"/>
    <button class="btn btn-teal w-100" type="submit" th:text="#{identity.password.reset.submit}">Save password</button>
  </form>
</main>
<th:block th:replace="~{layout/base :: scripts}"></th:block>
</body>
</html>
