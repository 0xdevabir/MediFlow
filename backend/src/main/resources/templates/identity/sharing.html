<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{layout/base :: head('identity.sharing.title')}"></head>
<body class="bg-light">
<div th:replace="~{layout/base :: nav}"></div>
<main class="container mb-5" style="max-width: 820px;">
  <div th:replace="~{layout/base :: flash}"></div>
  <h1 class="h3 mb-3" th:text="#{identity.sharing.title}">Share with another doctor</h1>
  <p class="text-muted" th:text="#{identity.sharing.intro}">Give another doctor time-limited access to this record.</p>

  <form th:action="@{/identity/sharing}" method="post" class="card card-body shadow-sm mb-4">
    <input type="hidden" name="patientId" th:value="${patientId}"/>
    <div class="row g-3">
      <div class="col-md-6">
        <label class="form-label" for="grantee" th:text="#{identity.sharing.grantee}">Doctor's username</label>
        <input class="form-control" id="grantee" name="grantee" required maxlength="100"/>
      </div>
      <div class="col-md-6">
        <label class="form-label" for="days" th:text="#{identity.sharing.days}">Days</label>
        <input class="form-control" type="number" id="days" name="days" value="7" min="1" th:max="${maxDays}" required/>
      </div>
      <div class="col-12">
        <label class="form-label" for="reason" th:text="#{identity.sharing.reason}">Reason</label>
        <input class="form-control" id="reason" name="reason" maxlength="500"/>
      </div>
      <div class="col-12 form-check ms-2" th:unless="${byPatient}">
        <input class="form-check-input" type="checkbox" id="patientAgreed" name="patientAgreed" value="true" required/>
        <label class="form-check-label" for="patientAgreed" th:text="#{identity.sharing.patientAgreed}">The patient agreed to this referral share.</label>
      </div>
    </div>
    <button class="btn btn-teal mt-3" type="submit" th:text="#{identity.sharing.submit}">Share</button>
  </form>

  <h2 class="h5" th:text="#{identity.sharing.list}">Current and past shares</h2>
  <p th:if="${shares.isEmpty()}" class="text-muted" th:text="#{identity.sharing.empty}">No shares.</p>
  <table class="table table-sm bg-white" th:unless="${shares.isEmpty()}">
    <thead><tr>
      <th th:text="#{identity.sharing.grantee}">Doctor</th>
      <th th:text="#{identity.sharing.reason}">Reason</th>
      <th th:text="#{identity.sharing.until}">Until</th>
      <th></th>
    </tr></thead>
    <tbody>
    <tr th:each="s : ${shares}">
      <td th:text="${names.get(s.granteeUserId) ?: '?'}">doctor</td>
      <td class="text-break" th:text="${s.reason}">reason</td>
      <td>
        <span th:text="${#temporals.format(s.expiresAt, 'yyyy-MM-dd HH:mm')}"></span>
        <span th:if="${s.revoked}" class="badge text-bg-secondary" th:text="#{identity.sharing.status.revoked}">revoked</span>
        <span th:if="${s.active}" class="badge text-bg-success" th:text="#{identity.sharing.status.active}">active</span>
      </td>
      <td>
        <form th:if="${s.active}" th:action="@{/identity/sharing/{id}/revoke(id=${s.id})}" method="post">
          <input type="hidden" name="patientId" th:value="${patientId}"/>
          <button class="btn btn-sm btn-outline-danger" type="submit" th:text="#{identity.sharing.revoke}">Revoke</button>
        </form>
      </td>
    </tr>
    </tbody>
  </table>
</main>
<th:block th:replace="~{layout/base :: scripts}"></th:block>
</body>
</html>
