<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{layout/base :: head('lab.doctor.title')}"></head>
<body class="bg-light">
<div th:replace="~{layout/base :: nav}"></div>
<main class="container mb-5">
  <div th:replace="~{layout/base :: flash}"></div>
  <h1 class="h3 mb-2" th:text="#{lab.doctor.title}">Order lab tests</h1>
  <p class="text-muted" th:text="#{lab.doctor.intro}">Select tests.</p>

  <form method="post" th:action="@{/lab/encounters/{id}/orders(id=${encounterId})}" class="mb-4">
    <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>
    <div class="form-check" th:each="item : ${catalog}">
      <input class="form-check-input" type="checkbox" name="testIds" th:value="${item.id()}" th:id="'d-'+${item.id()}"/>
      <label class="form-check-label" th:for="'d-'+${item.id()}">
        <span th:text="${item.name()}">Test</span>
        <span class="small text-muted" th:text="${item.code()}"></span>
      </label>
    </div>
    <button class="btn btn-primary mt-3" type="submit" th:text="#{lab.doctor.submit}">Order</button>
  </form>

  <h2 class="h5" th:text="#{lab.doctor.existing}">Existing</h2>
  <ul th:if="${!orders.isEmpty()}">
    <li th:each="o : ${orders}">
      <span th:text="${o.itemName()}">Test</span> —
      <span th:text="${o.status()}">STATUS</span>
      <a th:href="@{/lab/reports/{id}(id=${o.orderId()})}" th:text="#{lab.reports.view}">View</a>
    </li>
  </ul>
</main>
<th:block th:replace="~{layout/base :: scripts}"></th:block>
</body>
</html>
