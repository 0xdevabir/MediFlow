<!DOCTYPE html>
<html th:lang="${#locale.language}" lang="en" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{layout/base :: head('lab.reports.title')}"></head>
<body class="mf-app">
<a th:replace="~{layout/base :: skipLink}"></a>
<div th:replace="~{layout/base :: nav}"></div>
<main id="main" class="container mb-5">
  <div th:replace="~{layout/base :: flash}"></div>
  <div th:replace="~{layout/fragments/page-shell :: page-header(titleKey='lab.reports.title', subtitleKey=null)}"></div>

  <div th:if="${orders == null or orders.isEmpty()}"
       th:replace="~{layout/fragments/empty-state :: empty(titleKey='lab.reports.empty', bodyKey=null)}"></div>

  <div class="table-responsive" th:unless="${orders == null or orders.isEmpty()}">
    <table class="table table-sm align-middle">
      <thead>
      <tr>
        <th th:text="#{lab.reports.item}">Item</th>
        <th th:text="#{lab.reports.status}">Status</th>
        <th th:text="#{lab.reports.ordered}">Ordered</th>
        <th></th>
      </tr>
      </thead>
      <tbody>
      <tr th:each="o : ${orders}">
        <td th:text="${o.itemName()}">Test</td>
        <td>
          <span th:replace="~{layout/fragments/status-badge :: badge(level='NORMAL', label=${o.status()})}"></span>
          <span th:if="${o.released() and o.abnormal()}"
                th:replace="~{layout/fragments/status-badge :: badgeKey(level='URGENT', labelKey='lab.reports.abnormal')}"></span>
          <span th:if="${o.released() and o.critical()}"
                th:replace="~{layout/fragments/status-badge :: badgeKey(level='CRITICAL', labelKey='lab.reports.critical')}"></span>
        </td>
        <td th:text="${o.orderedAt()}">—</td>
        <td>
          <a class="btn btn-sm btn-outline-secondary" th:href="@{/lab/reports/{id}(id=${o.orderId()})}"
             th:text="#{lab.reports.view}">View</a>
        </td>
      </tr>
      </tbody>
    </table>
  </div>
</main>
<th:block th:replace="~{layout/base :: scripts}"></th:block>
</body>
</html>
