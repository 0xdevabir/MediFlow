<!DOCTYPE html>
<html th:lang="${#locale.language}" lang="en" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{layout/base :: head('lab.tech.title')}"></head>
<body class="mf-app">
<a th:replace="~{layout/base :: skipLink}"></a>
<div th:replace="~{layout/base :: nav}"></div>
<main id="main" class="container mf-panel-narrow mb-5">
  <div th:replace="~{layout/base :: flash}"></div>
  <header class="mb-4">
    <h1 class="mf-page-title" th:text="${view.order().itemName()}">Order</h1>
    <p class="mf-page-subtitle mb-0">
      <span th:text="${view.order().patientName()}">Patient</span> ·
      <span th:replace="~{layout/fragments/status-badge :: badge(level='NORMAL', label=${view.order().status()})}"></span> ·
      <span th:text="${view.order().orderType()}">TYPE</span>
    </p>
  </header>

  <p th:if="${view.sampleBarcode() != null}">
    <strong th:text="#{lab.tech.barcode}">Barcode</strong>:
    <code th:text="${view.sampleBarcode()}"></code>
  </p>

  <section class="mb-4" th:if="${view.canCollect()}">
    <h2 class="h5" th:text="#{lab.tech.collect}">Collect</h2>
    <form method="post" th:action="@{/lab/queue/{id}/collect(id=${view.order().orderId()})}" class="vstack gap-2" style="max-width: 28rem">
      <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>
      <label class="form-label" th:text="#{lab.tech.qr}">QR</label>
      <input class="form-control" name="qrToken" required autocomplete="off"/>
      <p class="small text-muted" th:text="#{lab.tech.qrHint}">Booking QR or patient identity QR.</p>
      <p class="small text-muted">Dev hint token: <code th:text="${qrToken}"></code></p>
      <button class="btn btn-teal align-self-start" type="submit" th:text="#{lab.tech.collect}">Collect</button>
    </form>
  </section>

  <section class="mb-4" th:if="${view.canReceive()}">
    <form method="post" th:action="@{/lab/queue/{id}/receive(id=${view.order().orderId()})}">
      <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>
      <button class="btn btn-teal" type="submit" th:text="#{lab.tech.receive}">Receive</button>
    </form>
  </section>

  <section class="mb-4" th:if="${view.canUpload()}">
    <h2 class="h5" th:text="#{lab.tech.upload}">Upload</h2>
    <form method="post" enctype="multipart/form-data"
          th:action="@{/lab/queue/{id}/results(id=${view.order().orderId()})}" class="vstack gap-3">
      <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>
      <div>
        <label class="form-label" th:text="#{lab.tech.summary}">Summary</label>
        <textarea class="form-control" name="summary" rows="2"></textarea>
      </div>
      <div>
        <label class="form-label" th:text="#{lab.tech.pdf}">PDF</label>
        <input class="form-control" type="file" name="pdf" accept="application/pdf"/>
      </div>
      <div th:each="a : ${view.analytes()}" class="border rounded p-2">
        <input type="hidden" name="analyteCode" th:value="${a.analyteCode}"/>
        <div class="fw-semibold" th:text="${a.analyteName}">Analyte</div>
        <div class="small text-muted">
          <span th:text="${a.loincCode}"></span>
          <span th:text="${a.ucumUnit}"></span>
          · ref <span th:text="${a.refLow}"></span>–<span th:text="${a.refHigh}"></span>
        </div>
        <div class="row g-2 mt-1">
          <div class="col-md-4">
            <input class="form-control" name="valueNumeric" th:placeholder="#{lab.tech.value}"/>
          </div>
          <div class="col-md-4">
            <input class="form-control" name="valueText" placeholder="text"/>
          </div>
          <div class="col-md-4">
            <select class="form-select" name="abnormalText">
              <option value="false">OK</option>
              <option value="true">Abnormal text</option>
            </select>
          </div>
        </div>
      </div>
      <button class="btn btn-teal align-self-start" type="submit" th:text="#{lab.tech.upload}">Upload</button>
    </form>
  </section>

  <section class="mb-4" th:if="${view.canVerify()}">
    <form method="post" th:action="@{/lab/queue/{id}/verify(id=${view.order().orderId()})}">
      <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>
      <button class="btn btn-success" type="submit" th:text="#{lab.tech.verify}">Verify</button>
    </form>
  </section>

  <p><a th:href="@{/lab/queue}" th:text="#{lab.queue.title}">Queue</a></p>
</main>
<th:block th:replace="~{layout/base :: scripts}"></th:block>
</body>
</html>
