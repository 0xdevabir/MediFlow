<!DOCTYPE html>
<html th:lang="${#locale.language}" lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1"/>
  <title th:text="#{login.title}">Login — MediFlow</title>
  <link rel="preconnect" href="https://fonts.googleapis.com"/>
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin="anonymous"/>
  <link rel="stylesheet"
        href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600&amp;family=Noto+Sans+Bengali:wght@400;500;600&amp;family=Source+Serif+4:opsz,wght@8..60,600;8..60,700&amp;display=swap"/>
  <link rel="stylesheet" th:href="@{/webjars/bootstrap/5.3.3/css/bootstrap.min.css}"/>
  <link rel="stylesheet" th:href="@{/css/app.css}"/>
</head>
<body>
<main class="mf-login-shell">
  <div class="mf-login-card">
    <h1 class="mf-brand-mark" th:text="#{app.name}">MediFlow</h1>
    <h2 class="h5 mb-3" th:text="#{login.title}">Sign in</h2>
    <div th:if="${param.error}" class="alert alert-danger mf-flash-enter" role="alert" th:text="#{login.error}">Invalid credentials</div>
    <div th:if="${param.logout}" class="alert alert-success mf-flash-enter" role="status" th:text="#{login.logout}">Signed out</div>
    <div th:if="${param.reset}" class="alert alert-success mf-flash-enter" role="status" th:text="#{identity.password.reset.done}">Password updated</div>
    <form th:action="@{/login}" method="post">
      <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>
      <div class="mb-3">
        <label class="form-label" for="username" th:text="#{login.username}">Username</label>
        <input class="form-control" type="text" id="username" name="username" required autofocus autocomplete="username"/>
      </div>
      <div class="mb-3">
        <label class="form-label" for="password" th:text="#{login.password}">Password</label>
        <input class="form-control" type="password" id="password" name="password" required autocomplete="current-password"/>
      </div>
      <button class="btn btn-teal w-100" type="submit" th:text="#{login.submit}">Sign in</button>
    </form>
    <p class="mt-3 mb-2 text-center">
      <a th:href="@{/identity/password/forgot}" th:text="#{identity.password.forgot.link}">Forgot password?</a>
    </p>
    <p class="mb-0 text-center">
      <a th:href="@{/directory}" th:text="#{login.directory}">Browse hospital directory</a>
    </p>
    <p class="small text-muted mt-3 mb-0 text-center" th:text="#{login.devHint}">Dev profile seeds role users with password "password".</p>
    <p class="small text-center mt-2 mb-0">
      <a th:href="@{''(lang=en)}">EN</a>
      ·
      <a th:href="@{''(lang=bn)}">বাংলা</a>
    </p>
  </div>
</main>
</body>
</html>
