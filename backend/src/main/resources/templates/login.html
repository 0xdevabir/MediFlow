<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1"/>
  <title th:text="#{login.title}">Login — MediFlow</title>
  <link rel="stylesheet" th:href="@{/webjars/bootstrap/5.3.3/css/bootstrap.min.css}"/>
  <link rel="stylesheet" th:href="@{/css/app.css}"/>
</head>
<body class="bg-light">
<main class="container" style="max-width: 420px; margin-top: 4rem;">
  <h1 class="h3 mb-3 text-center" th:text="#{app.name}">MediFlow</h1>
  <div class="card shadow-sm">
    <div class="card-body">
      <h2 class="h5 mb-3" th:text="#{login.title}">Sign in</h2>
      <div th:if="${param.error}" class="alert alert-danger" th:text="#{login.error}">Invalid credentials</div>
      <div th:if="${param.logout}" class="alert alert-success" th:text="#{login.logout}">Signed out</div>
      <div th:if="${param.reset}" class="alert alert-success" th:text="#{identity.password.reset.done}">Password updated</div>
      <form th:action="@{/login}" method="post">
        <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>
        <div class="mb-3">
          <label class="form-label" for="username" th:text="#{login.username}">Username</label>
          <input class="form-control" type="text" id="username" name="username" required autofocus/>
        </div>
        <div class="mb-3">
          <label class="form-label" for="password" th:text="#{login.password}">Password</label>
          <input class="form-control" type="password" id="password" name="password" required/>
        </div>
        <button class="btn btn-teal w-100" type="submit" th:text="#{login.submit}">Sign in</button>
      </form>
      <p class="mt-3 mb-0 text-center">
        <a th:href="@{/identity/password/forgot}" th:text="#{identity.password.forgot.link}">Forgot password?</a>
      </p>
    </div>
  </div>
  <p class="small text-muted mt-3 text-center" th:text="#{login.devHint}">Dev profile seeds role users with password "password".</p>
</main>
</body>
</html>
