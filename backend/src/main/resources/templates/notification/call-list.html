<!DOCTYPE html>
<html th:lang="${#locale.language}" lang="en" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{layout/base :: head('notification.callList.title')}"></head>
<body class="mf-app">
<a th:replace="~{layout/base :: skipLink}"></a>
<div th:replace="~{layout/base :: nav}"></div>
<main id="main" class="container mf-panel-wide mb-5">
  <div th:replace="~{layout/base :: flash}"></div>
  <header class="mb-4">
    <h1 class="mf-page-title" th:text="#{notification.callList.title}">Staff call list</h1>
    <p class="mf-page-subtitle mb-0" th:text="#{notification.callList.hint}">Please phone the person.</p>
  </header>
  <ul th:replace="~{notification/fragments :: subnav('callList')}"></ul>
  <div th:if="${rows.isEmpty()}"
       th:replace="~{layout/fragments/empty-state :: empty('notification.callList.empty', null)}"></div>
  <div class="table-responsive" th:unless="${rows.isEmpty()}">
    <table class="table mf-data-table mf-table-stack align-middle mb-0">
      <thead>
      <tr>
        <th th:text="#{notification.callList.patient}">Patient</th>
        <th th:text="#{notification.callList.phone}">Phone</th>
        <th th:text="#{notification.callList.event}">Event</th>
        <th th:text="#{notification.callList.reason}">Reason</th>
        <th th:text="#{notification.callList.message}">Message</th>
        <th th:text="#{notification.callList.since}">Since</th>
        <th></th>
      </tr>
      </thead>
      <tbody>
      <tr th:each="row : ${rows}">
        <td th:attr="data-label=#{notification.callList.patient}">
          <span th:if="${row.entry.priority.name() == 'HIGH'}"
                th:replace="~{layout/fragments/status-badge :: badgeKey('CRITICAL', 'notification.priority.HIGH')}"></span>
          <span th:text="${row.patientName}">Name</span>
        </td>
        <td th:attr="data-label=#{notification.callList.phone}">
          <a th:if="${row.phone != null}" th:href="'tel:' + ${row.phone}" th:text="${row.phone}">01700000000</a>
        </td>
        <td class="small" th:attr="data-label=#{notification.callList.event}" th:text="${row.entry.eventType}">RED_ALERT</td>
        <td class="small" th:attr="data-label=#{notification.callList.reason}" th:text="${row.entry.reason}">Reason</td>
        <td class="small" style="white-space: pre-line" th:attr="data-label=#{notification.callList.message}" th:text="${row.entry.message}">Message</td>
        <td class="small text-muted" th:attr="data-label=#{notification.callList.since}"
            th:text="${@templateRenderer.formatInstant(row.entry.createdAt, #locale)}">7 Nov</td>
        <td class="text-end">
          <form th:action="@{/notifications/call-list/{id}/resolve(id=${row.entry.id})}" method="post">
            <button class="btn btn-sm btn-outline-success" type="submit" th:text="#{notification.callList.resolve}">Resolved</button>
          </form>
        </td>
      </tr>
      </tbody>
    </table>
  </div>
</main>
<th:block th:replace="~{layout/base :: scripts}"></th:block>
</body>
</html>
