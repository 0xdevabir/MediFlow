<!DOCTYPE html>
<html th:lang="${#locale.language}" lang="en" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{layout/base :: head('notification.inbox.title')}"></head>
<body class="mf-app">
<a th:replace="~{layout/base :: skipLink}"></a>
<div th:replace="~{layout/base :: nav}"></div>
<main id="main" class="container mf-panel-wide mb-5">
  <div th:replace="~{layout/base :: flash}"></div>
  <header class="mb-4 d-flex flex-wrap align-items-start justify-content-between gap-3">
    <div>
      <h1 class="mf-page-title" th:text="#{notification.inbox.title}">Notifications</h1>
      <p class="mf-page-subtitle mb-0" th:text="#{notification.inbox.lead}">Your recent alerts and messages.</p>
    </div>
    <form th:action="@{/notifications/read-all}" method="post" th:if="${!rows.isEmpty()}">
      <button class="btn btn-sm btn-outline-secondary" type="submit" th:text="#{notification.inbox.markAllRead}">Mark all read</button>
    </form>
  </header>
  <ul th:replace="~{notification/fragments :: subnav('inbox')}"></ul>
  <div th:if="${rows.isEmpty()}"
       th:replace="~{layout/fragments/empty-state :: empty('notification.inbox.empty', 'notification.inbox.empty.hint')}"></div>
  <div class="mf-panel p-0" th:unless="${rows.isEmpty()}" role="list">
    <article class="mf-worklist-row" th:each="row : ${rows}" role="listitem"
             th:classappend="${row.unread} ? ' border-start border-4 border-primary'">
      <div class="flex-grow-1">
        <div class="fw-semibold d-flex flex-wrap align-items-center gap-2">
          <span th:if="${row.high}"
                th:replace="~{layout/fragments/status-badge :: badgeKey('CRITICAL', 'notification.priority.HIGH')}"></span>
          <span th:if="${row.unread}"
                th:replace="~{layout/fragments/status-badge :: badgeKey('AI', 'notification.inbox.unread')}"></span>
          <span th:text="${row.notification.subject}">Subject</span>
        </div>
        <div class="mt-1" style="white-space: pre-line" th:text="${row.notification.body}">Body</div>
        <div class="small text-muted mt-1"
             th:text="${@templateRenderer.formatInstant(row.notification.createdAt, #locale)}">7 Nov 2026</div>
      </div>
      <form th:if="${row.unread}" th:action="@{/notifications/{id}/read(id=${row.notification.id})}" method="post">
        <button class="btn btn-sm btn-outline-primary" type="submit" th:text="#{notification.inbox.markRead}">Mark read</button>
      </form>
    </article>
  </div>
</main>
<th:block th:replace="~{layout/base :: scripts}"></th:block>
</body>
</html>
