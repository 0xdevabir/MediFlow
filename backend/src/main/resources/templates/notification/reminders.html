<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{layout/base :: head('notification.reminders.title')}"></head>
<body class="bg-light">
<div th:replace="~{layout/base :: nav}"></div>
<main class="container mb-5">
  <div th:replace="~{layout/base :: flash}"></div>
  <h1 class="h3 mb-3" th:text="#{notification.reminders.title}">My medicine reminders</h1>
  <ul th:replace="~{notification/fragments :: subnav('reminders')}"></ul>
  <th:block th:if="${hasPatient}">
    <div class="card mb-3" style="max-width: 20rem">
      <div class="card-body">
        <div class="small text-muted" th:text="#{notification.reminders.adherence}">Adherence</div>
        <div class="display-6" data-testid="adherence-percent" th:if="${adherence != null}" th:text="${adherence} + '%'">90%</div>
        <div class="text-muted" th:if="${adherence == null}" th:text="#{notification.reminders.adherence.none}">No doses due yet</div>
      </div>
    </div>
    <p th:if="${rows.isEmpty()}" class="text-muted" th:text="#{notification.reminders.empty}">No reminders.</p>
    <div class="table-responsive" th:unless="${rows.isEmpty()}">
      <table class="table table-sm align-middle bg-white">
        <thead>
        <tr>
          <th th:text="#{notification.reminders.when}">When</th>
          <th th:text="#{notification.reminders.what}">Medicine</th>
          <th th:text="#{notification.reminders.status}">Status</th>
          <th></th>
        </tr>
        </thead>
        <tbody>
        <tr th:each="row : ${rows}">
          <td th:text="${row.when}">7 Nov 2026, 8:00 AM</td>
          <td><span th:text="${row.drug}">Napa</span> <span class="text-muted small" th:text="${row.dose}">500 mg</span></td>
          <td>
            <span th:if="${row.outcome != null and row.outcome.name() == 'TAKEN'}" class="badge bg-success" th:text="#{notification.reminders.taken}">Taken</span>
            <span th:if="${row.outcome != null and row.outcome.name() == 'SKIPPED'}" class="badge bg-secondary" th:text="#{notification.reminders.skipped}">Skipped</span>
            <span th:if="${row.outcome == null and row.due}" class="badge bg-warning text-dark" th:text="#{notification.reminders.due}">Due</span>
            <span th:if="${row.outcome == null and !row.due}" class="badge bg-light text-dark" th:text="#{notification.reminders.upcoming}">Upcoming</span>
          </td>
          <td class="text-end">
            <th:block th:if="${row.due}">
              <form class="d-inline" th:action="@{/notifications/reminders/{id}/ack(id=${row.reminder.id})}" method="post">
                <input type="hidden" name="outcome" value="TAKEN"/>
                <button class="btn btn-sm btn-success" type="submit" th:text="#{notification.reminders.markTaken}">I took it</button>
              </form>
              <form class="d-inline" th:action="@{/notifications/reminders/{id}/ack(id=${row.reminder.id})}" method="post">
                <input type="hidden" name="outcome" value="SKIPPED"/>
                <button class="btn btn-sm btn-outline-secondary" type="submit" th:text="#{notification.reminders.markSkipped}">Skipped</button>
              </form>
            </th:block>
          </td>
        </tr>
        </tbody>
      </table>
    </div>
  </th:block>
  <p th:unless="${hasPatient}" class="text-muted" th:text="#{notification.reminders.empty}">No reminders.</p>
</main>
<th:block th:replace="~{layout/base :: scripts}"></th:block>
</body>
</html>
