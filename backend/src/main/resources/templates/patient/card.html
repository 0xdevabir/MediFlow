<!DOCTYPE html>
<html th:lang="${#locale.language}" lang="en" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{layout/base :: head('patient.card.title')}"></head>
<body class="mf-app">
<a th:replace="~{layout/base :: skipLink}"></a>
<div th:replace="~{layout/base :: nav}"></div>
<main id="main" class="container mb-5" style="max-width: 480px;">
  <div th:replace="~{layout/base :: flash}"></div>
  <div class="text-center p-4 border rounded-3 bg-white">
    <h1 class="mf-page-title h4" th:text="#{app.name}">MediFlow</h1>
    <p class="mb-1 fs-5" th:text="${patient.fullName()}">Name</p>
    <p class="fw-semibold mb-3" th:text="${patient.mrn()}">MRN</p>
    <img class="img-fluid" th:src="${qrDataUri}" width="220" height="220"
         style="max-width: min(70vw, 220px);" th:alt="#{patient.card.qr}" alt="Patient QR"/>
    <p class="small text-muted mt-3 mb-0" th:text="#{patient.card.expires}">Expires soon</p>
    <button class="btn btn-teal mt-3 d-print-none w-100 w-sm-auto" onclick="window.print()"
            th:text="#{patient.card.print}">Print</button>
  </div>
</main>
<th:block th:replace="~{layout/base :: scripts}"></th:block>
</body>
</html>
