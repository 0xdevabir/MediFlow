<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{layout/base :: head('patient.change.listTitle')}"></head>
<body class="mf-app">
<a th:replace="~{layout/base :: skipLink}"></a>
<div th:replace="~{layout/base :: nav}"></div>
<main id="main" class="container mf-panel-wide mb-5">
  <div th:replace="~{layout/base :: flash}"></div>
  <h1 class="mf-page-title mb-3" th:text="#{patient.change.listTitle}">Demographic change requests</h1>
  <div class="list-group" th:if="${!#lists.isEmpty(requests)}">
    <div class="list-group-item" th:each="r : ${requests}">
      <div class="d-flex justify-content-between">
        <div>
          <a th:href="@{/patients/{id}(id=${r.patientId})}" th:text="${r.patientId}">patient</a>
          <div class="small text-muted">
            <span th:if="${r.newGivenName != null}" th:text="${r.newGivenName}">given</span>
            <span th:if="${r.newFamilyName != null}" th:text="${r.newFamilyName}">family</span>
            <span th:if="${r.newDateOfBirth != null}" th:text="${r.newDateOfBirth}">dob</span>
          </div>
          <div class="small" th:text="${r.reason}">reason</div>
        </div>
        <div class="d-flex gap-2">
          <form th:action="@{/patients/changes/{id}(id=${r.id})}" method="post">
            <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>
            <input type="hidden" name="approve" value="true"/>
            <button class="btn btn-sm btn-success" type="submit" th:text="#{patient.change.approve}">Approve</button>
          </form>
          <form th:action="@{/patients/changes/{id}(id=${r.id})}" method="post">
            <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>
            <input type="hidden" name="approve" value="false"/>
            <button class="btn btn-sm btn-outline-danger" type="submit" th:text="#{patient.change.reject}">Reject</button>
          </form>
        </div>
      </div>
    </div>
  </div>
  <p class="text-muted" th:if="${#lists.isEmpty(requests)}" th:text="#{patient.change.empty}">None pending</p>
</main>
<th:block th:replace="~{layout/base :: scripts}"></th:block>
</body>
</html>
