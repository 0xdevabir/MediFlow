<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<body>
<!--/*
  Expects model: pct (Integer|null), adherenceConfigured (boolean),
  adherencePercent (alias of pct), nextVisit (optional).
*/-->
<section th:fragment="adherenceWidget" class="mf-tile mb-4" sec:authorize="hasRole('PATIENT')"
         aria-labelledby="patient-adherence-title">
  <h2 id="patient-adherence-title" class="mf-tile-title" th:text="#{patient.dashboard.adherence}">
    Medicine adherence
  </h2>
  <div th:if="${pct != null}">
    <div class="display-6" data-testid="adherence-percent" th:text="${pct} + '%'">90%</div>
    <div class="progress mt-2" role="progressbar"
         th:attr="aria-valuenow=${pct}" aria-valuemin="0" aria-valuemax="100">
      <div class="progress-bar"
           th:classappend="${pct >= 80 ? 'bg-success' : (pct >= 50 ? 'bg-warning' : 'bg-danger')}"
           th:style="'width: ' + ${pct} + '%'"></div>
    </div>
    <a class="btn btn-sm btn-outline-secondary mt-3" th:href="@{/notifications/reminders}"
       th:text="#{patient.dashboard.cta.reminders}">Reminders</a>
  </div>
  <p th:if="${pct == null}" class="mf-tile-meta mb-0"
     th:text="${adherenceConfigured} ? #{patient.dashboard.adherence.empty} : #{patient.dashboard.adherence.pending}">
    No doses due yet
  </p>
</section>

<!-- Role-home tile set for HomeController -->
<div th:fragment="dashboard" class="mf-role-grid mf-role-grid-3">
  <section class="mf-tile">
    <h3 class="mf-tile-title" th:text="#{patient.dashboard.nextAppt}">Next appointment</h3>
    <p class="mf-tile-meta" th:if="${nextVisit != null}"
       th:text="${nextVisit.summary()}">Next visit</p>
    <p class="mf-tile-meta" th:if="${nextVisit == null}"
       th:text="#{patient.dashboard.nextAppt.empty}">No upcoming visit on file</p>
    <a class="btn btn-sm btn-teal" th:href="@{/appointments}"
       th:text="#{patient.dashboard.cta.appointments}">Appointments</a>
  </section>
  <section class="mf-tile">
    <h3 class="mf-tile-title" th:text="#{patient.dashboard.book}">Book a visit</h3>
    <p class="mf-tile-meta" th:text="#{patient.dashboard.book.body}">Find a hospital or doctor</p>
    <a class="btn btn-sm btn-teal" th:href="@{/directory}"
       th:text="#{patient.dashboard.cta.directory}">Directory</a>
  </section>
  <section class="mf-tile">
    <h3 class="mf-tile-title" th:text="#{patient.dashboard.adherence}">Medicine adherence</h3>
    <p class="mf-tile-meta" th:if="${adherencePercent != null}"
       th:text="#{patient.dashboard.adherence.value(${adherencePercent})}">Adherence 80%</p>
    <p class="mf-tile-meta" th:if="${adherencePercent == null}"
       th:text="${adherenceConfigured} ? #{patient.dashboard.adherence.empty} : #{patient.dashboard.adherence.pending}">
      No doses due
    </p>
    <a class="btn btn-sm btn-outline-secondary" th:href="@{/patients/me/dashboard}"
       th:text="#{patient.dashboard.cta.open}">Open</a>
  </section>
</div>
</body>
</html>
