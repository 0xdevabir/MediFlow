<!DOCTYPE html>
<html th:lang="${#locale.language}" lang="en" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{layout/base :: head(${pageTitleKey})}"></head>
<body class="mf-app">
<a th:replace="~{layout/base :: skipLink}"></a>
<div th:replace="~{layout/base :: nav}"></div>
<main id="main" class="container mf-panel-narrow mb-5">
  <div th:replace="~{layout/base :: flash}"></div>
  <h1 class="mf-page-title mb-3" th:text="${selfSignup} ? #{patient.register.title} : #{patient.walkin.title}">Register</h1>
  <p class="mf-page-subtitle" th:text="${selfSignup} ? #{patient.register.lead} : #{patient.walkin.lead}">Demographics</p>

  <form th:action="${selfSignup} ? @{/patients/register} : @{/patients/walk-in}" method="post" th:object="${form}" class="border rounded-3 bg-white p-4">
    <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>
    <div class="row g-3">
      <div class="col-md-6">
        <label class="form-label" for="givenName" th:text="#{patient.field.givenName}">Given name</label>
        <input class="form-control" id="givenName" th:field="*{givenName}" required maxlength="100"/>
      </div>
      <div class="col-md-6">
        <label class="form-label" for="familyName" th:text="#{patient.field.familyName}">Family name</label>
        <input class="form-control" id="familyName" th:field="*{familyName}" required maxlength="100"/>
      </div>
      <div class="col-md-6">
        <label class="form-label" for="dateOfBirth" th:text="#{patient.field.dob}">Date of birth</label>
        <input class="form-control" type="date" id="dateOfBirth" th:field="*{dateOfBirth}" required/>
      </div>
      <div class="col-md-6">
        <label class="form-label" for="sex" th:text="#{patient.field.sex}">Sex</label>
        <select class="form-select" id="sex" th:field="*{sex}" required>
          <option value="">—</option>
          <option value="MALE" th:text="#{patient.sex.male}">Male</option>
          <option value="FEMALE" th:text="#{patient.sex.female}">Female</option>
          <option value="OTHER" th:text="#{patient.sex.other}">Other</option>
        </select>
      </div>
      <div class="col-md-6">
        <label class="form-label" for="phone" th:text="#{patient.field.phone}">Phone</label>
        <input class="form-control" id="phone" th:field="*{phone}" maxlength="40"/>
      </div>
      <div class="col-md-6">
        <label class="form-label" for="email" th:text="#{patient.field.email}">Email</label>
        <input class="form-control" type="email" id="email" th:field="*{email}" maxlength="120"/>
      </div>
      <div class="col-md-6">
        <label class="form-label" for="nationalId" th:text="#{patient.field.nationalId}">National ID</label>
        <input class="form-control" id="nationalId" th:field="*{nationalId}" maxlength="40"/>
      </div>
      <div class="col-12">
        <label class="form-label" for="address" th:text="#{patient.field.address}">Address</label>
        <textarea class="form-control" id="address" th:field="*{address}" rows="2" maxlength="500"></textarea>
      </div>
      <div class="col-md-6" th:if="${selfSignup}">
        <label class="form-label" for="username" th:text="#{patient.field.username}">Username</label>
        <input class="form-control" id="username" th:field="*{username}" required minlength="3" maxlength="100"/>
      </div>
      <div class="col-md-6" th:if="${selfSignup}">
        <label class="form-label" for="password" th:text="#{patient.field.password}">Password</label>
        <input class="form-control" type="password" id="password" th:field="*{password}" required minlength="12" autocomplete="new-password"/>
        <div class="form-text" th:text="#{patient.register.passwordHint}">At least 12 characters.</div>
      </div>
      <div class="col-12">
        <div class="form-check">
          <input class="form-check-input" type="checkbox" id="consent" th:field="*{consent}" required/>
          <label class="form-check-label" for="consent" th:text="#{patient.register.consent}">I agree</label>
        </div>
      </div>
      <div class="col-12">
        <button class="btn btn-teal" type="submit" th:text="#{patient.register.submit}">Submit</button>
      </div>
    </div>
  </form>
</main>
<th:block th:replace="~{layout/base :: scripts}"></th:block>
</body>
</html>
