<!DOCTYPE html>
<html th:lang="${#locale.language}" lang="en" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{layout/base :: head(${pageTitleKey})}"></head>
<body class="mf-app">
<a th:replace="~{layout/base :: skipLink}"></a>
<div th:replace="~{layout/base :: nav}"></div>
<main id="main" class="container mf-panel-wide mb-5">
  <div th:replace="~{layout/base :: flash}"></div>
  <p class="mb-2"><a th:href="@{/pharmacy}">&larr; <span th:text="#{pharmacy.home.title}">Pharmacy</span></a></p>
  <div th:replace="~{layout/fragments/page-shell :: page-header(titleKey='pharmacy.stock.batches', subtitleKey='pharmacy.stock.lead')}"></div>

  <p><a th:href="@{/pharmacy/rx/{id}(id=${rxId})}">&larr; Dispense</a></p>
  <table class="table table-sm mf-table">
    <thead><tr><th>Batch ID</th><th>No</th><th>Expiry</th><th>Qty</th></tr></thead>
    <tbody>
    <tr th:each="b : ${batches}">
      <td class="font-monospace small" th:text="${b.batchId()}">id</td>
      <td th:text="${b.batchNo()}">B1</td>
      <td th:text="${b.expiryDate()}">2027-01-01</td>
      <td th:text="${b.quantity()}">10</td>
    </tr>
    </tbody>
  </table>

</main>
<th:block th:replace="~{layout/base :: scripts}"></th:block>
</body>
</html>
