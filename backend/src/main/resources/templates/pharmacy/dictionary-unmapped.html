<!DOCTYPE html>
<html th:lang="${#locale.language}" lang="en" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{layout/base :: head(${pageTitleKey})}"></head>
<body class="mf-app">
<a th:replace="~{layout/base :: skipLink}"></a>
<div th:replace="~{layout/base :: nav}"></div>
<main id="main" class="container mf-panel-wide mb-5">
  <div th:replace="~{layout/base :: flash}"></div>
  <p class="mb-2"><a th:href="@{/pharmacy/dictionary}">&larr; <span th:text="#{pharmacy.dictionary.title}">Dictionary</span></a></p>
  <div th:replace="~{layout/fragments/page-shell :: page-header(titleKey='pharmacy.dictionary.unmapped', subtitleKey='pharmacy.dictionary.lead')}"></div>

  <pre class="bg-light p-3 small" th:text="${unmappedReport}"> </pre>

</main>
<th:block th:replace="~{layout/base :: scripts}"></th:block>
</body>
</html>
