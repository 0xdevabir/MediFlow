<!DOCTYPE html>
<html th:lang="${#locale.language}" lang="en" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{layout/base :: head(${pageTitleKey})}"></head>
<body class="mf-app">
<a th:replace="~{layout/base :: skipLink}"></a>
<div th:replace="~{layout/base :: nav}"></div>
<main id="main" class="container mf-panel-wide mb-5">
  <div th:replace="~{layout/base :: flash}"></div>
  <p class="mb-2"><a th:href="@{/pharmacy}">&larr; <span th:text="#{pharmacy.home.title}">Pharmacy</span></a></p>
  <div th:replace="~{layout/fragments/page-shell :: page-header(titleKey='pharmacy.substitution.title', subtitleKey='pharmacy.substitution.lead')}"></div>
<div class="border rounded p-3 mb-3" th:each="r : ${rows}">
    <div th:text="|Rx ${r.prescriptionId} · brand ${r.proposedBrandId}|">rx</div>
    <div class="small" th:text="${r.reason}">reason</div>
    <form class="d-inline" th:action="@{/pharmacy/substitutions/{id}/decide(id=${r.id})}" method="post">
      <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>
      <input type="hidden" name="approve" value="true"/>
      <button class="btn btn-sm btn-success" type="submit" th:text="#{pharmacy.substitution.approve}">Approve</button>
    </form>
    <form class="d-inline" th:action="@{/pharmacy/substitutions/{id}/decide(id=${r.id})}" method="post">
      <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>
      <input type="hidden" name="approve" value="false"/>
      <button class="btn btn-sm btn-outline-danger" type="submit" th:text="#{pharmacy.substitution.reject}">Reject</button>
    </form>
  </div>
</main>
<th:block th:replace="~{layout/base :: scripts}"></th:block>
</body>
</html>
