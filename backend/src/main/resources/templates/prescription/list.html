<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{layout/base :: head('rx.title.list')}"></head>
<body class="bg-light">
<div th:replace="~{layout/base :: nav}"></div>
<main class="container mb-5">
  <div th:replace="~{layout/base :: flash}"></div>
  <h1 class="h3 mb-3" th:text="#{rx.title.list}">Prescriptions</h1>
  <p class="text-muted" th:text="#{rx.list.hint}">Open a draft from a consultation.</p>
  <form class="row g-2" th:action="@{/prescriptions/new}" method="get" style="max-width: 28rem">
    <div class="col">
      <input class="form-control" name="encounterId" required placeholder="encounter UUID"/>
    </div>
    <div class="col-auto">
      <button class="btn btn-primary" type="submit" th:text="#{rx.title.new}">New</button>
    </div>
  </form>
</main>
<th:block th:replace="~{layout/base :: scripts}"></th:block>
</body>
</html>
