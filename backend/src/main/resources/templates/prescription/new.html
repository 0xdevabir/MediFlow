<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{layout/base :: head('rx.title.new')}"></head>
<body class="bg-light">
<div th:replace="~{layout/base :: nav}"></div>
<main class="container mb-5" style="max-width: 40rem">
  <div th:replace="~{layout/base :: flash}"></div>
  <h1 class="h3 mb-3" th:text="#{rx.title.new}">New draft</h1>
  <form th:action="@{/prescriptions}" method="post" enctype="multipart/form-data" class="card card-body">
    <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>
    <input type="hidden" name="encounterId" th:value="${encounterId}"/>
    <div class="mb-3">
      <label class="form-label" th:text="#{rx.new.mode}">Mode</label>
      <select class="form-select" name="mode" id="mode">
        <option value="MANUAL" th:text="#{rx.new.mode.MANUAL}">Manual</option>
        <option value="TEXT" th:text="#{rx.new.mode.TEXT}">Text</option>
        <option value="PHOTO" th:text="#{rx.new.mode.PHOTO}">Photo</option>
      </select>
    </div>
    <div class="mb-3" id="textBlock">
      <label class="form-label" th:text="#{rx.new.text}">Text</label>
      <textarea class="form-control" name="typedText" rows="4"></textarea>
    </div>
    <div class="mb-3" id="photoBlock">
      <label class="form-label" th:text="#{rx.new.photo}">Photo</label>
      <input class="form-control" type="file" name="photo" accept="image/*"/>
    </div>
    <button class="btn btn-primary" type="submit" th:text="#{rx.new.submit}">Create</button>
  </form>
</main>
<th:block th:replace="~{layout/base :: scripts}"></th:block>
</body>
</html>
