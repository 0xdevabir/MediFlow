<!DOCTYPE html>
<html th:lang="${#locale.language}" lang="en" xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head th:replace="~{layout/base :: head('queue.board.title')}"></head>
<body class="mf-app">
<a th:replace="~{layout/base :: skipLink}"></a>
<div th:replace="~{layout/base :: nav}"></div>
<main id="main" class="container mf-panel-wide mb-5">
  <div th:replace="~{layout/base :: flash}"></div>
  <div th:replace="~{layout/fragments/page-shell :: page-header(titleKey='queue.board.title', subtitleKey='queue.board.subtitle')}"></div>

  <form class="row g-2 mb-4" method="get" th:action="@{/queue/home}">
    <div class="col-md-5">
      <label class="form-label" for="queue-doctor" th:text="#{queue.board.doctorId}">Doctor</label>
      <input class="form-control" id="queue-doctor" name="doctorId" th:value="${doctorId}"
             th:placeholder="#{queue.board.doctorId}" required>
    </div>
    <div class="col-md-3">
      <label class="form-label" for="queue-date" th:text="#{queue.board.date}">Date</label>
      <input class="form-control" id="queue-date" type="date" name="date" th:value="${queueDate}">
    </div>
    <div class="col-md-2 d-flex align-items-end">
      <button class="btn btn-outline-secondary w-100" type="submit" th:text="#{queue.board.load}">Load</button>
    </div>
  </form>

  <div th:if="${doctorId != null}"
       th:replace="~{layout/fragments/live-region :: region('queue-board-live', 'polite')}"></div>

  <div th:if="${board == null or board.isEmpty()}"
       th:replace="~{layout/fragments/empty-state :: empty('queue.board.empty', 'queue.board.emptyHint')}"></div>

  <div class="table-responsive mf-table-stack" th:if="${board != null and !board.isEmpty()}">
    <table class="table table-sm align-middle mf-data-table">
      <thead>
        <tr>
          <th th:text="#{queue.board.token}">Token</th>
          <th th:text="#{queue.board.patient}">Patient</th>
          <th th:text="#{queue.board.level}">Level</th>
          <th th:text="#{queue.board.vitals}">Vitals</th>
          <th th:text="#{queue.board.ahead}">Ahead</th>
          <th sec:authorize="hasRole('NURSE')" th:text="#{queue.board.actions}">Actions</th>
        </tr>
      </thead>
      <tbody>
        <tr th:each="r : ${board}"
            th:classappend="${r.emergencyFlag()} ? 'table-warning' : (${#strings.equalsIgnoreCase(r.level().name(),'URGENT')} ? 'table-warning' : '')">
          <td data-label="Token"><strong th:text="${r.tokenNo()}">T001</strong></td>
          <td data-label="Patient" th:text="${r.patientLabel()}">Name</td>
          <td data-label="Level">
            <span th:replace="~{layout/fragments/status-badge :: badge(${r.level()}, ${r.level()})}"></span>
          </td>
          <td data-label="Vitals" th:text="${r.vitals()}">—</td>
          <td data-label="Ahead" th:text="${r.ahead()}">0</td>
          <td data-label="Actions" sec:authorize="hasRole('NURSE')">
            <form class="d-inline-flex gap-1 flex-wrap mb-1" method="post"
                  th:action="@{/queue/{id}/move-up(id=${r.queueEntryId()})}">
              <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">
              <input type="hidden" name="doctorId" th:value="${doctorId}">
              <input type="hidden" name="date" th:value="${queueDate}">
              <input class="form-control form-control-sm" style="width:10rem" name="reason" required
                     th:placeholder="#{queue.board.reason}" th:aria-label="#{queue.board.reason}">
              <button class="btn btn-sm btn-outline-primary" type="submit" th:text="#{queue.board.moveUp}">Up</button>
            </form>
            <form class="d-inline-flex gap-1 flex-wrap" method="post" th:action="@{/queue/triage}">
              <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">
              <input type="hidden" name="appointmentId" th:value="${r.appointmentId()}">
              <input type="hidden" name="doctorId" th:value="${doctorId}">
              <input type="hidden" name="date" th:value="${queueDate}">
              <select class="form-select form-select-sm" name="level" style="width:8rem"
                      th:aria-label="#{queue.board.level}">
                <option th:each="l : ${levels}" th:value="${l}" th:text="${l}">NORMAL</option>
              </select>
              <select class="form-select form-select-sm" name="symptomSeverity" style="width:9rem"
                      th:aria-label="#{queue.board.severity}">
                <option value="">—</option>
                <option value="MILD">MILD</option>
                <option value="MODERATE">MODERATE</option>
                <option value="SEVERE">SEVERE</option>
                <option value="LIFE_THREATENING">LIFE_THREATENING</option>
              </select>
              <button class="btn btn-sm btn-warning" type="submit" th:text="#{queue.board.triage}">Triage</button>
            </form>
          </td>
        </tr>
      </tbody>
    </table>
  </div>
</main>
<th:block th:replace="~{layout/base :: scripts}"></th:block>
<script th:if="${doctorId != null}" th:src="@{/js/appointment-queue.js}"
        th:attr="data-doctor-id=${doctorId}, data-queue-date=${queueDate}, data-mode=board,
                 data-live-id=queue-board-live"></script>
</body>
</html>
