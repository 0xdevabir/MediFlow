<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{layout/base :: head('queue.doctor.title')}"></head>
<body class="bg-light">
<div th:replace="~{layout/base :: nav}"></div>
<main class="container mb-5">
  <div th:replace="~{layout/base :: flash}"></div>
  <div class="d-flex justify-content-between align-items-center mb-3">
    <h1 class="h3 mb-0" th:text="#{queue.doctor.title}">Doctor queue</h1>
    <form method="post" th:action="@{/queue/call-next}">
      <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">
      <input type="hidden" name="doctorId" th:value="${doctorId}">
      <input type="hidden" name="date" th:value="${queueDate}">
      <button class="btn btn-primary" type="submit" th:text="#{queue.doctor.callNext}">Call next</button>
    </form>
  </div>
  <div th:if="${board == null or board.isEmpty()}" class="text-muted" th:text="#{queue.board.empty}">Empty</div>
  <ol class="list-group list-group-numbered" th:if="${board != null}">
    <li class="list-group-item d-flex justify-content-between"
        th:each="r : ${board}">
      <span>
        <strong th:text="${r.tokenNo()}">T001</strong>
        — <span th:text="${r.patientLabel()}">Name</span>
        <span class="badge text-bg-secondary ms-2" th:text="${r.level()}">NORMAL</span>
      </span>
      <span class="text-muted" th:text="${r.status()}">WAITING</span>
    </li>
  </ol>
</main>
<th:block th:replace="~{layout/base :: scripts}"></th:block>
<script th:src="@{/js/appointment-queue.js}"
        th:attr="data-doctor-id=${doctorId}, data-queue-date=${queueDate}, data-mode=board"></script>
</body>
</html>
