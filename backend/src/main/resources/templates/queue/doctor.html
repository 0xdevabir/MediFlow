<!DOCTYPE html>
<html th:lang="${#locale.language}" lang="en" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{layout/base :: head('queue.doctor.title')}"></head>
<body class="mf-app">
<a th:replace="~{layout/base :: skipLink}"></a>
<div th:replace="~{layout/base :: nav}"></div>
<main id="main" class="container mf-panel-wide mb-5">
  <div th:replace="~{layout/base :: flash}"></div>
  <div class="d-flex flex-wrap justify-content-between align-items-start gap-3 mb-4">
    <div>
      <h1 class="mf-page-title" th:text="#{queue.doctor.title}">Doctor queue</h1>
      <p class="mf-page-subtitle mb-0" th:text="#{queue.doctor.subtitle}">Call the next waiting patient.</p>
    </div>
    <form method="post" th:action="@{/queue/call-next}" class="sticky-bottom-md">
      <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">
      <input type="hidden" name="doctorId" th:value="${doctorId}">
      <input type="hidden" name="date" th:value="${queueDate}">
      <button class="btn btn-teal btn-lg" type="submit" th:text="#{queue.doctor.callNext}">Call next</button>
    </form>
  </div>

  <div th:replace="~{layout/fragments/live-region :: region('queue-doctor-live', 'polite')}"></div>

  <div th:if="${board == null or board.isEmpty()}"
       th:replace="~{layout/fragments/empty-state :: empty('queue.board.empty', 'queue.doctor.emptyHint')}"></div>

  <ol class="list-group list-group-numbered mf-worklist" th:if="${board != null and !board.isEmpty()}">
    <li class="list-group-item d-flex flex-wrap justify-content-between gap-2 align-items-center"
        th:each="r : ${board}"
        th:classappend="${#strings.equalsIgnoreCase(r.level().name(),'URGENT')} ? ' mf-priority-urgent' : (${#strings.equalsIgnoreCase(r.level().name(),'CRITICAL')} ? ' mf-priority-critical' : '')">
      <span>
        <strong th:text="${r.tokenNo()}">T001</strong>
        — <span th:text="${r.patientLabel()}">Name</span>
        <span class="ms-2"
              th:replace="~{layout/fragments/status-badge :: badge(${r.level()}, ${r.level()})}"></span>
      </span>
      <span class="text-muted" th:text="${r.status()}">WAITING</span>
    </li>
  </ol>
</main>
<th:block th:replace="~{layout/base :: scripts}"></th:block>
<script th:src="@{/js/appointment-queue.js}"
        th:attr="data-doctor-id=${doctorId}, data-queue-date=${queueDate}, data-mode=board,
                 data-live-id=queue-doctor-live"></script>
</body>
</html>
