# Local full stack: layered on top of docker-compose.yml (the infra) by `make up`.
#   docker compose -f infra/docker-compose.yml -f infra/docker-compose.app.yml --env-file .env up -d --build
services:
  minio-init:
    # same image as the minio server (it ships the mc client)
    image: minio/minio:RELEASE.2025-04-22T22-12-26Z
    container_name: mediflow-minio-init
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
      mc alias set local http://minio:9000 $${MINIO_USER} $${MINIO_PASS} &&
      mc mb --ignore-existing local/$${MINIO_BUCKET}"
    environment:
      MINIO_USER: ${MEDIFLOW_MINIO_ACCESS_KEY:-mediflow}
      MINIO_PASS: ${MEDIFLOW_MINIO_SECRET_KEY:-mediflowsecret}
      MINIO_BUCKET: ${MEDIFLOW_MINIO_BUCKET:-mediflow}
    restart: "no"

  backend:
    build:
      context: ../backend
      dockerfile: Dockerfile
    image: mediflow-backend:local
    container_name: mediflow-backend
    environment:
      # dev = seeded demo users (password "password"), MFA not enforced, no template cache
      SPRING_PROFILES_ACTIVE: ${MEDIFLOW_SPRING_PROFILES:-dev,pharmacy}
      MEDIFLOW_PORT: "8080"
      MANAGEMENT_SERVER_PORT: "8081"
      MEDIFLOW_DB_URL: jdbc:postgresql://postgres:5432/${MEDIFLOW_DB_NAME:-mediflow}
      MEDIFLOW_DB_USER: ${MEDIFLOW_DB_USER:-mediflow}
      MEDIFLOW_DB_PASSWORD: ${MEDIFLOW_DB_PASSWORD:-mediflow}
      MEDIFLOW_REDIS_HOST: redis
      MEDIFLOW_REDIS_PORT: "6379"
      MEDIFLOW_RABBIT_HOST: rabbitmq
      MEDIFLOW_RABBIT_PORT: "5672"
      MEDIFLOW_RABBIT_USER: ${MEDIFLOW_RABBIT_USER:-mediflow}
      MEDIFLOW_RABBIT_PASSWORD: ${MEDIFLOW_RABBIT_PASSWORD:-mediflow}
      MEDIFLOW_MINIO_ENDPOINT: http://minio:9000
      MEDIFLOW_MINIO_ACCESS_KEY: ${MEDIFLOW_MINIO_ACCESS_KEY:-mediflow}
      MEDIFLOW_MINIO_SECRET_KEY: ${MEDIFLOW_MINIO_SECRET_KEY:-mediflowsecret}
      MEDIFLOW_MINIO_BUCKET: ${MEDIFLOW_MINIO_BUCKET:-mediflow}
      MEDIFLOW_MAIL_HOST: mailpit
      MEDIFLOW_MAIL_PORT: "1025"
      MEDIFLOW_FIELD_ENCRYPTION_KEY: ${MEDIFLOW_FIELD_ENCRYPTION_KEY}
      MEDIFLOW_INTERNAL_API_KEY: ${MEDIFLOW_INTERNAL_API_KEY:-}
      MEDIFLOW_SESSION_TIMEOUT_MINUTES: ${MEDIFLOW_SESSION_TIMEOUT_MINUTES:-15}
      MEDIFLOW_FHIR_BASE_URL: http://localhost:${MEDIFLOW_APP_PORT:-8080}/fhir/r4
    ports:
      - "${MEDIFLOW_APP_PORT:-8080}:8080"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      minio:
        condition: service_healthy
      mailpit:
        condition: service_healthy
      minio-init:
        condition: service_completed_successfully
    restart: unless-stopped

  ai-api:
    build:
      context: ../ai-service
      dockerfile: Dockerfile
      args:
        # paddle is a very large download; tesseract is enough locally. Override with AI_EXTRAS=paddle,tesseract
        AI_EXTRAS: ${AI_EXTRAS:-tesseract}
    image: mediflow-ai:local
    container_name: mediflow-ai-api
    command: ["api"]
    environment: &ai-env
      AI_PORT: "8000"
      MEDIFLOW_AI_AMQP_URL: amqp://${MEDIFLOW_RABBIT_USER:-mediflow}:${MEDIFLOW_RABBIT_PASSWORD:-mediflow}@rabbitmq:5672/
      MEDIFLOW_AI_S3_ENDPOINT: http://minio:9000
      MEDIFLOW_AI_S3_ACCESS_KEY: ${MEDIFLOW_MINIO_ACCESS_KEY:-mediflow}
      MEDIFLOW_AI_S3_SECRET_KEY: ${MEDIFLOW_MINIO_SECRET_KEY:-mediflowsecret}
      MEDIFLOW_AI_S3_BUCKET: ${MEDIFLOW_MINIO_BUCKET:-mediflow}
      MEDIFLOW_AI_DICTIONARY_URL: http://backend:8080/api/internal/dictionary/export
      MEDIFLOW_AI_DICTIONARY_TOKEN: ${MEDIFLOW_INTERNAL_API_KEY:-}
      MEDIFLOW_AI_OCR_BACKEND: ${MEDIFLOW_AI_OCR_BACKEND:-auto}
    ports:
      - "${MEDIFLOW_AI_PORT:-8000}:8000"
    depends_on:
      rabbitmq:
        condition: service_healthy
      minio-init:
        condition: service_completed_successfully
    restart: unless-stopped

  ai-worker:
    image: mediflow-ai:local
    container_name: mediflow-ai-worker
    command: ["worker"]
    environment: *ai-env
    depends_on:
      ai-api:
        condition: service_started
      rabbitmq:
        condition: service_healthy
    restart: unless-stopped
