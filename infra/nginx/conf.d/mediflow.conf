# ---------------------------------------------------------------------------
# :8080 (host :80) - health probe + redirect everything to HTTPS
# ---------------------------------------------------------------------------
server {
  listen 8080 default_server;
  listen [::]:8080 default_server;
  server_name _;

  location = /nginx-health { access_log off; default_type text/plain; return 200 "ok\n"; }
  location / { return 301 https://$host$request_uri; }
}

# ---------------------------------------------------------------------------
# :8443 (host :443) - TLS 1.3 only
# ---------------------------------------------------------------------------
server {
  listen 8443 ssl default_server;
  listen [::]:8443 ssl default_server;
  http2 on;
  server_name _;

  ssl_certificate     /etc/nginx/certs/server.crt;   # full chain
  ssl_certificate_key /etc/nginx/certs/server.key;
  ssl_protocols TLSv1.3;
  ssl_ecdh_curve X25519:prime256v1:secp384r1;
  ssl_prefer_server_ciphers off;                    # TLS 1.3 suites are all strong
  ssl_session_cache shared:TLS:10m;
  ssl_session_timeout 1h;
  ssl_session_tickets off;

  # ---- Security headers (server level; locations below must NOT use add_header) ----
  # The app sets its own Content-Security-Policy; nginx owns the transport-level ones.
  proxy_hide_header Strict-Transport-Security;
  proxy_hide_header X-Frame-Options;
  proxy_hide_header X-Content-Type-Options;
  proxy_hide_header Referrer-Policy;
  proxy_hide_header X-Powered-By;
  proxy_hide_header Server;
  add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;
  add_header X-Frame-Options "DENY" always;
  add_header X-Content-Type-Options "nosniff" always;
  add_header Referrer-Policy "strict-origin-when-cross-origin" always;
  add_header Permissions-Policy "camera=(self), microphone=(), geolocation=(), payment=(), usb=()" always;
  add_header Cross-Origin-Opener-Policy "same-origin" always;
  add_header Cross-Origin-Resource-Policy "same-origin" always;
  add_header X-Request-Id $request_id always;

  limit_conn perip 50;

  # ---- Common proxy settings ----
  proxy_http_version 1.1;
  proxy_set_header Connection "";
  proxy_set_header Host $host;
  proxy_set_header X-Real-IP $remote_addr;
  proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
  proxy_set_header X-Forwarded-Proto $scheme;
  proxy_set_header X-Forwarded-Host $host;
  proxy_set_header X-Forwarded-Port 443;
  proxy_set_header X-Request-Id $request_id;
  proxy_connect_timeout 5s;
  proxy_read_timeout 60s;
  proxy_send_timeout 60s;

  # ---- Never expose internals ----
  location ^~ /actuator/     { return 404; }   # actuator lives on :8081, internal network only
  location ^~ /api/internal/ { return 404; }   # service-to-service (e.g. AI dictionary export)

  # ---- Server-Sent Events: no buffering, no gzip, long-lived ----
  # AI job progress: GET /api/ai-jobs/{jobId}/events ; queue boards etc.: any /api/**/events|stream
  location ~ ^/api/(.+/)?(events|stream)$ {
    limit_req zone=api burst=20 nodelay;
    proxy_pass http://backend;
    proxy_buffering off;
    proxy_cache off;
    gzip off;
    chunked_transfer_encoding on;
    proxy_read_timeout 1h;
    proxy_send_timeout 1h;
  }

  # ---- Login / MFA: strict brute-force limits ----
  location = /login {
    limit_req zone=login_post burst=5 nodelay;
    limit_req zone=web burst=30 nodelay;
    proxy_pass http://backend;
  }
  location ~ ^/(mfa|login/mfa|identity/mfa|password)(/|$) {
    limit_req zone=mfa burst=5 nodelay;
    proxy_pass http://backend;
  }

  # ---- Booking (POST only is limited) ----
  location ^~ /appointments {
    limit_req zone=booking_post burst=10 nodelay;
    limit_req zone=web burst=60 nodelay;
    proxy_pass http://backend;
  }

  # ---- AI job submission: POST /api/prescriptions/{id}/ai-jobs ----
  location ~ ^/api/prescriptions/[^/]+/ai-jobs$ {
    limit_req zone=aijobs burst=10 nodelay;
    proxy_pass http://backend;
  }

  # ---- REST / FHIR API ----
  location ^~ /api/ {
    limit_req zone=api burst=40 nodelay;
    proxy_pass http://backend;
  }
  location ^~ /fhir/ {
    limit_req zone=api burst=40 nodelay;
    proxy_pass http://backend;
  }

  # ---- Static assets (served by Spring, cacheable) ----
  location ~ ^/(css|js|images|webjars)/ {
    proxy_pass http://backend;
    expires 7d;
  }

  # ---- Everything else (Thymeleaf pages) ----
  location / {
    limit_req zone=web burst=60 nodelay;
    proxy_pass http://backend;
  }
}
