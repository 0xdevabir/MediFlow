# MediFlow edge proxy (nginxinc/nginx-unprivileged: runs as uid 101, listens on 8080/8443).
worker_processes auto;
pid /tmp/nginx.pid;
error_log /dev/stderr warn;

events {
  worker_connections 4096;   # SSE keeps one connection per open AI job / queue screen
}

http {
  include /etc/nginx/mime.types;
  default_type application/octet-stream;

  # Unprivileged image: temp paths must be writable by uid 101
  client_body_temp_path /tmp/client_temp;
  proxy_temp_path       /tmp/proxy_temp;
  fastcgi_temp_path     /tmp/fastcgi_temp;
  uwsgi_temp_path       /tmp/uwsgi_temp;
  scgi_temp_path        /tmp/scgi_temp;

  # No PHI in logs: path only (query strings dropped), no bodies, no cookies.
  log_format main_noquery '$remote_addr - [$time_iso8601] "$request_method $uri $server_protocol" '
                          '$status $body_bytes_sent $request_time $upstream_response_time "$http_user_agent" rid=$request_id';
  access_log /dev/stdout main_noquery;

  sendfile on;
  tcp_nopush on;
  keepalive_timeout 65s;
  server_tokens off;
  client_max_body_size 12m;          # prescription photos
  client_body_timeout 30s;
  client_header_timeout 15s;
  send_timeout 30s;

  # gzip (text only; never for SSE - handled per location)
  gzip on;
  gzip_vary on;
  gzip_proxied any;
  gzip_comp_level 5;
  gzip_min_length 1024;
  gzip_types text/plain text/css application/javascript application/json application/fhir+json
             application/xml image/svg+xml;

  # ---- Rate limiting (per client IP) ----
  limit_req_status 429;
  limit_conn_status 429;
  limit_req_zone $binary_remote_addr zone=mfa:10m     rate=20r/m;
  limit_req_zone $binary_remote_addr zone=aijobs:10m  rate=30r/m;   # AI job submission
  limit_req_zone $binary_remote_addr zone=api:20m     rate=20r/s;
  limit_req_zone $binary_remote_addr zone=web:20m     rate=30r/s;
  limit_conn_zone $binary_remote_addr zone=perip:10m;

  # Only rate-limit writes on login/booking (GET renders the form)
  map $request_method $login_write_key { default ""; POST $binary_remote_addr; }
  limit_req_zone $login_write_key zone=login_post:10m rate=10r/m;
  map $request_method $booking_write_key { default ""; POST $binary_remote_addr; }
  limit_req_zone $booking_write_key zone=booking_post:10m rate=30r/m;

  map $http_upgrade $connection_upgrade { default upgrade; "" ""; }

  upstream backend {
    server backend:8080;
    keepalive 64;
  }

  include /etc/nginx/conf.d/*.conf;
}
